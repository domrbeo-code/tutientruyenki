                {activeTab === 'combat' && (
                  <div style={{ display:'flex', flexDirection:'column', gap:'16px', height:'100%' }}>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'10px' }}>
                      <div>
                        <div style={{ fontFamily:'Cinzel Decorative,serif', fontSize:'16px', fontWeight:700, color:'#f5c842', marginBottom:'4px' }}>⚔️ Trảm Yêu Thử Luyện</div>
                        <div style={{ fontSize:'11px', color:'rgba(160,140,200,0.6)' }}>Tiêu diệt yêu thú để nhận linh khí và rớt trang bị ngẫu nhiên.</div>
                      </div>
                      {/* Monster selector */}
                      <div style={{ display:'flex', gap:'6px', flexWrap:'wrap' }}>
                        {MONSTERS.map((m, idx) => (
                          <button key={m.id} onClick={() => { setCurrentMonsterIdx(idx); setMonsterHp(m.hp); }}
                            style={{ padding:'6px 12px', borderRadius:'8px', fontSize:'11px', fontFamily:'Cinzel,serif', fontWeight:700, cursor:'pointer', transition:'all 0.15s',
                              background: currentMonsterIdx === idx ? `linear-gradient(135deg, rgba(80,20,20,0.8), rgba(50,10,10,0.9))` : 'rgba(20,10,40,0.6)',
                              border: `1px solid ${currentMonsterIdx === idx ? m.color : 'rgba(100,60,180,0.25)'}`,
                              color: currentMonsterIdx === idx ? '#f5e6c8' : 'rgba(180,160,220,0.5)',
                              boxShadow: currentMonsterIdx === idx ? `0 0 15px ${m.color}40` : 'none' }}>
                            {m.icon} {m.name}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Arena */}
                    <div className="monster-arena" style={{ flex:1 }}>
                      {/* Monster display */}
                      <div id="monster-icon-display" style={{ fontSize:'72px', filter:`drop-shadow(0 0 20px ${MONSTERS[currentMonsterIdx].color})`, textAlign:'center', animation: isDead ? 'none' : 'bounce 2s infinite' }}>
                        {isDead ? '💨' : MONSTERS[currentMonsterIdx].icon}
                      </div>

                      {/* Monster info */}
                      <div style={{ textAlign:'center' }}>
                        <div style={{ fontFamily:'Cinzel,serif', fontWeight:900, fontSize:'18px', color: isDead ? 'rgba(160,140,200,0.4)' : '#f5e6c8', marginBottom:'4px', textShadow:`0 0 20px ${MONSTERS[currentMonsterIdx].color}60` }}>
                          {isDead ? '— Đã bị tiêu diệt —' : MONSTERS[currentMonsterIdx].name}
                        </div>
                        <div style={{ fontSize:'11px', color:'#67e8f9' }}>
                          +{MONSTERS[currentMonsterIdx].reward} Linh Khí • Rớt Trang Bị Ngẫu Nhiên
                        </div>
                      </div>

                      {/* HP bar */}
                      <div style={{ width:'100%', maxWidth:'360px' }}>
                        <div style={{ display:'flex', justifyContent:'space-between', fontSize:'11px', marginBottom:'5px' }}>
                          <span style={{ color:'rgba(220,180,180,0.7)' }}>💀 Sinh Mệnh Yêu Thú</span>
                          <span style={{ color:'#fca5a5', fontWeight:700 }}>{Math.max(0, monsterHp)} / {MONSTERS[currentMonsterIdx].hp}</span>
                        </div>
                        <div className="hp-bar-track">
                          <div className="hp-bar-fill" style={{ width:`${Math.max(0, (monsterHp / MONSTERS[currentMonsterIdx].hp) * 100)}%` }}></div>
                        </div>
                      </div>

                      {/* Attack buttons */}
                      <div style={{ display:'flex', gap:'12px', width:'100%', maxWidth:'360px' }}>
                        <button onClick={() => attackMonster(1)} disabled={isDead} className="btn-danger btn-attack"
                          style={{ flex:1, padding:'12px', borderRadius:'12px', fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'12px', letterSpacing:'0.5px', cursor: isDead ? 'not-allowed' : 'pointer', opacity: isDead ? 0.4 : 1, display:'flex', alignItems:'center', justifyContent:'center', gap:'6px' }}>
                          ⚔️ Ra Đòn Cơ Bản
                        </button>
                        <button onClick={() => attackMonster(3)} disabled={isDead} className="btn-attack"
                          style={{ flex:1, padding:'12px', borderRadius:'12px', fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'12px', letterSpacing:'0.5px', cursor: isDead ? 'not-allowed' : 'pointer', opacity: isDead ? 0.4 : 1, background:'linear-gradient(135deg, #7c2d12, #431407)', border:'1px solid rgba(251,146,60,0.5)', color:'#fed7aa', display:'flex', alignItems:'center', justifyContent:'center', gap:'6px', boxShadow: isDead ? 'none' : '0 0 20px rgba(251,146,60,0.25)' }}>
                          🔥 Tất Sát (×3)
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* ─── SECT TAB ─── */}
                {activeTab === 'sect' && (
                  <div style={{ display:'flex', flexDirection:'column', gap:'16px' }}>
                    <div>
                      <div style={{ fontFamily:'Cinzel Decorative,serif', fontSize:'16px', fontWeight:700, color:'#f5c842', marginBottom:'4px' }}>⛩️ Vạn Đạo Tông Môn</div>
                      <div className="ornament-divider" style={{ margin:'8px 0' }}>GIA NHẬP HOẶC KHAI SƠN LẬP PHÁI</div>
                    </div>
                    <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(280px, 1fr))', gap:'14px' }}>
                      {/* Sect list */}
                      <div style={{ display:'flex', flexDirection:'column', gap:'10px', gridColumn:'span 1' }}>
                        <div style={{ fontSize:'10px', letterSpacing:'2px', color:'rgba(245,200,66,0.5)', textTransform:'uppercase', fontFamily:'Cinzel,serif' }}>— Danh Sách Tông Môn —</div>
                        <div style={{ display:'flex', flexDirection:'column', gap:'8px', maxHeight:'320px', overflowY:'auto' }} className="no-scrollbar">
                          {allSects.map(sect => {
                            const isJoined = gameState.joinedSectId === sect.id;
                            return (
                              <div key={sect.id} className={`item-card${isJoined ? ' joined' : ''}`} style={{ padding:'14px', display:'flex', flexDirection:'column', gap:'8px' }}>
                                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
                                  <div style={{ display:'flex', alignItems:'center', gap:'8px' }}>
                                    <span style={{ fontSize:'20px' }}>{sect.icon || '⛩️'}</span>
                                    <div>
                                      <div style={{ fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'13px', color:'#f5c842' }}>{sect.name}</div>
                                      <div style={{ fontSize:'9px', color:'rgba(160,140,200,0.5)' }}>Sáng lập: {sect.founder || 'Hệ Thống'}</div>
                                    </div>
                                  </div>
                                  {isJoined && <span style={{ fontSize:'9px', color:'#f5c842', background:'rgba(92,60,10,0.5)', border:'1px solid rgba(245,200,66,0.4)', padding:'2px 8px', borderRadius:'20px', fontFamily:'Cinzel,serif', fontWeight:700 }}>✦ Đã Gia Nhập</span>}
                                </div>
                                <div style={{ fontSize:'11px', color:'#67e8f9' }}>{sect.buff}</div>
                                <div style={{ fontSize:'10px', color:'rgba(160,140,200,0.5)' }}>{sect.desc}</div>
                                {!isJoined && (
                                  <button onClick={() => setGameState(prev => ({ ...prev, joinedSectId: sect.id, logs: [{ id: Date.now().toString(), text: `[Tông Môn]: Gia nhập "${sect.name}" thành công!`, type: 'shop', time: Date.now() }, ...prev.logs].slice(0, 100) }))}
                                    className="btn-primary" style={{ alignSelf:'flex-start', padding:'6px 14px', width:'auto', fontSize:'10px' }}>
                                    Gia Nhập
                                  </button>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      {/* Create sect form */}
                      <div style={{ display:'flex', flexDirection:'column', gap:'12px' }}>
                        <div style={{ fontSize:'10px', letterSpacing:'2px', color:'rgba(245,200,66,0.5)', textTransform:'uppercase', fontFamily:'Cinzel,serif' }}>— Khai Sơn Lập Phái —</div>
                        <div style={{ padding:'16px', background:'rgba(0,0,0,0.4)', border:'1px solid rgba(100,60,180,0.25)', borderRadius:'12px', display:'flex', flexDirection:'column', gap:'12px' }}>
                          <div style={{ fontSize:'11px', color:'rgba(160,140,200,0.6)' }}>
                            Yêu cầu cảnh giới: <span style={{ color:'#22d3ee', fontFamily:'Cinzel,serif', fontWeight:700 }}>Trúc Cơ Kỳ (Sơ Kỳ)</span> trở lên.
                          </div>
                          <form onSubmit={handleCreateSect} style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
                            <div style={{ display:'flex', flexDirection:'column', gap:'4px' }}>
                              <label style={{ fontSize:'10px', color:'rgba(180,160,220,0.6)', letterSpacing:'1px' }}>TÊN TÔNG MÔN</label>
                              <input type="text" value={newSectName} onChange={e => setNewSectName(e.target.value)} placeholder="Ví dụ: Thiên Kiếm Tông..."
                                style={{ background:'rgba(0,0,0,0.7)', border:'1px solid rgba(100,60,180,0.4)', borderRadius:'10px', padding:'8px 12px', fontSize:'12px', color:'#f5e6c8', fontFamily:'Share Tech Mono,monospace', outline:'none' }} />
                            </div>
                            <div style={{ display:'flex', flexDirection:'column', gap:'4px' }}>
                              <label style={{ fontSize:'10px', color:'rgba(180,160,220,0.6)', letterSpacing:'1px' }}>MÔ TẢ THẾ LỰC</label>
                              <textarea value={newSectDesc} onChange={e => setNewSectDesc(e.target.value)} placeholder="Mô tả về tôn chỉ tông môn..."
                                style={{ background:'rgba(0,0,0,0.7)', border:'1px solid rgba(100,60,180,0.4)', borderRadius:'10px', padding:'8px 12px', fontSize:'12px', color:'#f5e6c8', fontFamily:'Share Tech Mono,monospace', outline:'none', height:'80px', resize:'none' }} />
                            </div>
                            <button type="submit" className="btn-primary" style={{ marginTop:'4px' }}>
                              ✦ Tạo Lập Tông Môn Mới
                            </button>
                          </form>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* ─── LEADERBOARD TAB ─── */}
                {activeTab === 'leaderboard' && (
                  <div style={{ display:'flex', flexDirection:'column', gap:'16px' }}>
                    <div>
                      <div style={{ fontFamily:'Cinzel Decorative,serif', fontSize:'16px', fontWeight:700, color:'#f5c842', marginBottom:'4px' }}>📜 Thiên Thư Bảng</div>
                      <div className="ornament-divider" style={{ margin:'8px 0' }}>ĐẠI NĂNG CƯỜNG GIẢ TOÀN CÕI TU TIÊN</div>
                    </div>
                    {fullLeaderboard.length === 0 ? (
                      <div style={{ textAlign:'center', padding:'60px 20px', color:'rgba(140,120,180,0.5)', fontFamily:'Cinzel,serif', fontSize:'13px' }}>Chưa có cao thủ nào ghi danh.</div>
                    ) : (
                      <div style={{ display:'flex', flexDirection:'column', gap:'6px', maxHeight:'380px', overflowY:'auto' }} className="no-scrollbar">
                        {fullLeaderboard.map((item, index) => {
                          const rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : 'rank-n';
                          const rankIcon = index === 0 ? '👑' : index === 1 ? '🥈' : index === 2 ? '🥉' : '';
                          return (
                            <div key={item.name} style={{ display:'flex', alignItems:'center', gap:'12px', padding:'12px 16px', borderRadius:'12px', border:`1px solid ${item.isPlayer ? 'rgba(192,132,252,0.5)' : 'rgba(60,30,100,0.3)'}`, background: item.isPlayer ? 'linear-gradient(135deg, rgba(60,20,110,0.5), rgba(30,10,60,0.6))' : 'linear-gradient(135deg, rgba(20,10,40,0.6), rgba(10,5,20,0.7))', transition:'all 0.2s' }}>
                              {/* Rank badge */}
                              <div className={rankClass} style={{ width:'32px', height:'32px', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'Cinzel,serif', fontWeight:900, fontSize:'11px', flexShrink:0 }}>
                                {rankIcon || (index + 1)}
                              </div>
                              <div style={{ flex:1 }}>
                                <div style={{ display:'flex', alignItems:'center', gap:'8px', marginBottom:'2px' }}>
                                  <span style={{ fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'13px', color:'#f5e6c8' }}>{item.name}</span>
                                  {item.isPlayer && <span style={{ fontSize:'9px', color:'#67e8f9', background:'rgba(6,182,212,0.2)', border:'1px solid rgba(6,182,212,0.4)', padding:'1px 6px', borderRadius:'10px', fontFamily:'Cinzel,serif' }}>CHÍNH MÌNH</span>}
                                </div>
                                <div style={{ fontSize:'10px', color:'rgba(100,200,255,0.6)' }}>{item.title}</div>
                              </div>
                              <div style={{ textAlign:'right' }}>
                                <div style={{ fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'13px', color:'#f5c842' }}>{formatNumber(item.totalQi)}</div>
                                <div style={{ fontSize:'9px', color:'rgba(180,160,200,0.4)', letterSpacing:'1px' }}>LINH KHÍ</div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}

                {/* ─── LOGS TAB ─── */}
                {activeTab === 'logs' && (
                  <div style={{ display:'flex', flexDirection:'column', gap:'16px', height:'100%' }}>
                    <div>
                      <div style={{ fontFamily:'Cinzel Decorative,serif', fontSize:'16px', fontWeight:700, color:'#f5c842', marginBottom:'4px' }}>📖 Nhật Ký Tu Tiên</div>
                      <div className="ornament-divider" style={{ margin:'8px 0' }}>HÀNH TRÌNH ĐỘT PHÁ & KỲ NGỘ</div>
                    </div>
                    <div style={{ flex:1, background:'rgba(0,0,0,0.5)', border:'1px solid rgba(60,30,100,0.3)', borderRadius:'12px', padding:'12px', overflowY:'auto', maxHeight:'380px' }} className="no-scrollbar">
                      {gameState.logs.length === 0 ? (
                        <div style={{ textAlign:'center', padding:'40px', color:'rgba(140,120,180,0.4)', fontFamily:'Cinzel,serif', fontSize:'12px' }}>Chưa có sự kiện nào được ghi nhận.</div>
                      ) : (
                        gameState.logs.map((log, i) => (
                          <div key={log.id + i} className={`log-entry type-${log.type}`}>
                            <span className="log-time">{new Date(log.time).toLocaleTimeString('vi', { hour:'2-digit', minute:'2-digit', second:'2-digit' })}</span>
                            <span className="log-text">{log.text}</span>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </main>

          {/* ══════════════ BLACK MARKET MODAL ══════════════ */}
          {isBlackMarketModalOpen && (
            <div className="modal-backdrop">
              <div className="modal-box">
                {/* Top glow */}
                <div style={{ position:'absolute', top:0, left:'15%', right:'15%', height:'1px', background:'linear-gradient(to right, transparent, rgba(245,200,66,0.6), transparent)' }}></div>
                <div className="corner-tl"></div><div className="corner-tr"></div><div className="corner-bl"></div><div className="corner-br"></div>

                {/* Header */}
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', borderBottom:'1px solid rgba(100,60,180,0.25)', paddingBottom:'16px' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:'14px' }}>
                    <div style={{ width:'48px', height:'48px', borderRadius:'12px', background:'linear-gradient(135deg, #451a03, #1c0900)', border:'1px solid rgba(245,200,66,0.4)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'22px', boxShadow:'0 0 20px rgba(245,200,66,0.2)' }}>🖤</div>
                    <div>
                      <div style={{ fontFamily:'Cinzel Decorative,serif', fontWeight:700, fontSize:'18px', color:'#f5c842' }}>Hắc Thị Chợ Đen</div>
                      <div style={{ fontSize:'11px', color:'rgba(160,140,200,0.5)', marginTop:'2px' }}>Ký gửi & giao dịch bảo vật trực tiếp với người chơi khác.</div>
                    </div>
                  </div>
                  <button onClick={() => setIsBlackMarketModalOpen(false)}
                    style={{ width:'36px', height:'36px', borderRadius:'50%', background:'rgba(60,10,10,0.7)', border:'1px solid rgba(220,60,60,0.4)', color:'#fca5a5', cursor:'pointer', fontSize:'14px', fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center', transition:'all 0.15s' }}>
                    ✕
                  </button>
                </div>

                {/* Content */}
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'16px', flex:1, overflowY:'auto' }} className="no-scrollbar">
                  {/* Left: My inventory */}
                  <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
                    <div style={{ fontSize:'12px', fontFamily:'Cinzel,serif', fontWeight:700, color:'#f5c842', display:'flex', alignItems:'center', gap:'6px' }}>
                      📦 Túi Đồ Của Bạn
                    </div>
                    <div style={{ display:'flex', flexDirection:'column', gap:'8px', maxHeight:'340px', overflowY:'auto' }} className="no-scrollbar">
                      {gameState.inventory.length === 0 ? (
                        <div style={{ textAlign:'center', padding:'40px 20px', color:'rgba(140,120,180,0.4)', fontSize:'11px', fontFamily:'Cinzel,serif' }}>Không có bảo vật nào trong túi. Hãy đi Trảm Yêu!</div>
                      ) : (
                        gameState.inventory.map(item => {
                          const gear = ALL_GEARS.find(g => g.id === item.gearId);
                          if (!gear) return null;
                          return (
                            <div key={item.uniqueId} style={{ padding:'12px', background:'rgba(30,10,60,0.5)', border:'1px solid rgba(100,60,180,0.25)', borderRadius:'12px', display:'flex', flexDirection:'column', gap:'8px' }}>
                              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                                <div style={{ display:'flex', alignItems:'center', gap:'8px' }}>
                                  <span style={{ fontSize:'18px' }}>{gear.icon}</span>
                                  <div>
                                    <div className={gear.colorClass} style={{ fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'12px' }}>{gear.name}</div>
                                    <div style={{ fontSize:'9px', color:'rgba(160,140,200,0.5)' }}>{gear.tier}</div>
                                  </div>
                                </div>
                                <div style={{ fontSize:'10px', color:'#22d3ee' }}>+{gear.clickBonus} C.Lực</div>
                              </div>
                              <div style={{ display:'flex', gap:'8px' }}>
                                <input type="number" placeholder="Nhập giá Qi..."
                                  value={listingPriceInput[item.uniqueId] || ''}
                                  onChange={e => setListingPriceInput(prev => ({ ...prev, [item.uniqueId]: e.target.value }))}
                                  style={{ flex:1, background:'rgba(0,0,0,0.7)', border:'1px solid rgba(245,200,66,0.3)', borderRadius:'8px', padding:'6px 10px', fontSize:'11px', color:'#f5c842', fontFamily:'Share Tech Mono,monospace', outline:'none' }} />
                                <button onClick={() => handleListMarketItem(item.uniqueId)} className="btn-gold"
                                  style={{ padding:'6px 12px', borderRadius:'8px', fontFamily:'Cinzel,serif', fontSize:'10px', fontWeight:700, cursor:'pointer', whiteSpace:'nowrap' }}>
                                  Ký Gửi
                                </button>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>

                  {/* Right: Market listings */}
                  <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
                    <div style={{ fontSize:'12px', fontFamily:'Cinzel,serif', fontWeight:700, color:'#f5c842', display:'flex', alignItems:'center', gap:'6px' }}>
                      🛒 Vật Phẩm Đang Rao Bán
                    </div>
                    <div style={{ display:'flex', flexDirection:'column', gap:'8px', maxHeight:'340px', overflowY:'auto' }} className="no-scrollbar">
                      {marketListings.length === 0 ? (
                        <div style={{ textAlign:'center', padding:'40px 20px', color:'rgba(140,120,180,0.4)', fontSize:'11px', fontFamily:'Cinzel,serif' }}>Hắc Thị hiện chưa có bảo vật nào được ký gửi.</div>
                      ) : (
                        marketListings.map(listing => {
                          const gear = ALL_GEARS.find(g => g.id === listing.gearId);
                          if (!gear) return null;
                          const isMyListing = listing.sellerName === playerName;
                          return (
                            <div key={listing.listingId} style={{ padding:'12px', background:'rgba(30,10,60,0.5)', border:'1px solid rgba(100,60,180,0.25)', borderRadius:'12px', display:'flex', flexDirection:'column', gap:'8px' }}>
                              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                                <div style={{ display:'flex', alignItems:'center', gap:'8px' }}>
                                  <span style={{ fontSize:'18px' }}>{gear.icon}</span>
                                  <div>
                                    <div className={gear.colorClass} style={{ fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'12px' }}>{gear.name}</div>
                                    <div style={{ fontSize:'9px', color:'rgba(160,140,200,0.5)' }}>Chủ nhân: <span style={{ color:'#67e8f9' }}>{listing.sellerName}</span></div>
                                  </div>
                                </div>
                                <div style={{ textAlign:'right' }}>
                                  <div style={{ fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'13px', color:'#f5c842' }}>{formatNumber(listing.price)}</div>
                                  <div style={{ fontSize:'9px', color:'rgba(180,160,200,0.4)' }}>Linh Khí</div>
                                </div>
                              </div>
                              {isMyListing ? (
                                <button onClick={() => handleCancelMarketListing(listing)} className="btn-danger"
                                  style={{ padding:'6px 12px', borderRadius:'8px', fontFamily:'Cinzel,serif', fontSize:'10px', fontWeight:700, cursor:'pointer', textAlign:'center' }}>
                                  ✕ Gỡ Bán
                                </button>
                              ) : (
                                <button onClick={() => handleBuyMarketItem(listing)} className="btn-success"
                                  style={{ padding:'6px 12px', borderRadius:'8px', fontFamily:'Cinzel,serif', fontSize:'10px', fontWeight:700, cursor:'pointer', textAlign:'center' }}>
                                  💰 Mua Lại — {formatNumber(listing.price)} Qi
                                </button>
                              )}
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Audio & FX Scripts (Unchanged from original) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const bgm = document.getElementById('bgm-audio');
      const sfxClick = document.getElementById('click-sfx');
      const sfxSlash = document.getElementById('slash-sfx');
      const audioBtn = document.getElementById('toggle-audio-btn');
      let isAudioMuted = true;

      audioBtn.addEventListener('click', () => {
        isAudioMuted = !isAudioMuted;
        if (isAudioMuted) {
          bgm.pause();
          audioBtn.innerText = '🔇';
          audioBtn.style.borderColor = 'rgba(192,132,252,0.4)';
          audioBtn.style.background = 'rgba(10,5,25,0.9)';
        } else {
          bgm.volume = 0.25;
          bgm.play().catch(e => {});
          audioBtn.innerText = '🎵';
          audioBtn.style.borderColor = 'rgba(52,211,153,0.6)';
          audioBtn.style.background = 'rgba(20,60,40,0.8)';
          audioBtn.style.color = '#6ee7b7';
        }
      });

      document.body.addEventListener('click', (e) => {
        const target = e.target.closest('button');
        if (!target) return;
        const text = target.innerText.toLowerCase();
        let floatingMsg = "";
        let floatColor = "";

        if (target.classList.contains('btn-attack') || text.includes('ra đòn') || text.includes('tất sát') || text.includes('3x')) {
          if (!isAudioMuted) { sfxSlash.currentTime = 0; sfxSlash.play().catch(()=>{}); }
          floatingMsg = Math.random() > 0.5 ? "⚔️ Bạo Kích!" : "💥 Trí Mạng!";
          floatColor = "#fb7185";
          const monsterIcon = document.getElementById('monster-icon-display');
          if (monsterIcon) {
            monsterIcon.classList.remove('shake-effect');
            void monsterIcon.offsetWidth;
            monsterIcon.classList.add('shake-effect');
          }
        } else if (text.includes('hấp thu') || text.includes('linh khí')) {
          if (!isAudioMuted) { sfxClick.currentTime = 0; sfxClick.play().catch(()=>{}); }
          floatingMsg = Math.random() > 0.5 ? "✨ +Qi" : "💫 Tụ Linh!";
          floatColor = "#67e8f9";
        }

        if (floatingMsg) {
          const floater = document.createElement('div');
          floater.className = 'floating-text';
          floater.style.color = floatColor;
          floater.style.fontSize = '13px';
          floater.innerText = floatingMsg;
          floater.style.left = (e.clientX - 20 + (Math.random() * 30 - 15)) + 'px';
          floater.style.top  = (e.clientY - 30) + 'px';
          document.body.appendChild(floater);
          setTimeout(() => floater.remove(), 1100);
        }
      });
    });
  </script>
</body>
</html>
