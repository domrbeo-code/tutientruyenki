<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phế Vật Nghịch Tập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0d0a;
    --bg-panel: #12160f;
    --bg-panel-2: #161b12;
    --text-main: #d8d3c4;
    --text-dim: #7a7d70;
    --jade: #6fae7c;
    --jade-dim: #3d5c45;
    --gold: #c9a24b;
    --gold-dim: #6b5726;
    --blood: #9a4b4b;
    --border: #2a2f22;
    --shadow: rgba(0,0,0,0.6);
    --font-display: 'Noto Serif SC', serif;
    --font-mono: 'JetBrains Mono', 'Consolas', monospace;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text-main);
    font-family: var(--font-mono);
  }

  body{
    background-image:
      radial-gradient(circle at 20% 10%, rgba(111,174,122,0.05), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(201,162,75,0.04), transparent 40%);
  }

  #game-container{
    max-width: 900px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 18px 16px 28px;
  }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 14px;
    padding: 10px 0 14px;
    position: relative;
  }

  .seal{
    width: 40px; height: 40px;
    min-width: 40px;
    border: 2px solid var(--blood);
    border-radius: 6px;
    display:flex; align-items:center; justify-content:center;
    color: var(--blood);
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 18px;
    box-shadow: 0 0 10px rgba(154,75,75,0.35) inset;
    transform: rotate(-3deg);
    background: rgba(154,75,75,0.06);
  }

  header h1{
    font-family: var(--font-display);
    font-weight: 900;
    letter-spacing: 4px;
    font-size: clamp(20px, 4vw, 30px);
    color: var(--gold);
    text-shadow: 0 0 18px rgba(201,162,75,0.25);
    margin: 0;
    text-align:center;
  }

  .divider{
    height: 10px;
    margin: 4px 0 18px;
    background: repeating-linear-gradient(
      to right,
      transparent 0px, transparent 6px,
      var(--jade-dim) 6px, var(--jade-dim) 8px
    );
    opacity: 0.5;
    mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
  }

  /* ---------- CHARACTER PANEL ---------- */
  #character-panel{
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px 18px;
    font-size: 13px;
    box-shadow: 0 4px 18px var(--shadow);
    position: sticky;
    top: 8px;
    z-index: 5;
    backdrop-filter: blur(2px);
  }

  .stat{
    display:flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat .label{
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .stat .value{
    color: var(--text-main);
    font-weight: 500;
  }

  .stat.realm .value{ color: var(--jade); }
  .stat.root .value{ color: var(--blood); }
  .stat.stone .value{ color: var(--gold); }

  /* ---------- STORY LOG ---------- */
  #story-log{
    flex: 1;
    background: var(--bg-panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 22px;
    min-height: 320px;
    max-height: 52vh;
    overflow-y: auto;
    line-height: 1.85;
    font-size: 15px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
  }

  #story-log::-webkit-scrollbar{ width: 8px; }
  #story-log::-webkit-scrollbar-track{ background: transparent; }
  #story-log::-webkit-scrollbar-thumb{ background: var(--jade-dim); border-radius: 4px; }

  .log-line{
    margin-bottom: 14px;
    white-space: pre-wrap;
    color: var(--text-main);
  }

  .log-line.system{
    color: var(--gold);
    font-style: italic;
    border-left: 2px solid var(--gold-dim);
    padding-left: 10px;
  }

  .log-line.narration{ color: var(--text-main); }
  .log-line.chapter-title{
    font-family: var(--font-display);
    color: var(--jade);
    font-size: 17px;
    letter-spacing: 2px;
    margin: 6px 0 16px;
    border-bottom: 1px dashed var(--jade-dim);
    padding-bottom: 8px;
  }

  .cursor{
    display:inline-block;
    width: 8px; height: 1em;
    background: var(--jade);
    vertical-align: text-bottom;
    animation: blink 1s step-start infinite;
    margin-left: 2px;
  }

  @keyframes blink{ 50%{ opacity: 0; } }

  /* ---------- CHOICES ---------- */
  #choices-panel{
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .choice-btn{
    background: var(--bg-panel);
    border: 1px solid var(--jade-dim);
    color: var(--text-main);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 13px 16px;
    border-radius: 6px;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: border-color 0.2s, background 0.2s, transform 0.1s;
  }

  .choice-btn:hover{
    border-color: var(--jade);
    background: rgba(111,174,122,0.08);
    transform: translateX(3px);
  }

  .choice-btn:active{ transform: translateX(1px) scale(0.99); }

  .choice-btn:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .choice-btn .arrow{ color: var(--gold); font-weight: 700; }

  .choice-btn:disabled{
    opacity: 0.4;
    cursor: not-allowed;
  }

  #restart-btn{
    display:none;
    margin-top: 6px;
    background: transparent;
    border: 1px solid var(--blood);
    color: var(--blood);
    font-family: var(--font-mono);
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
  }

  #restart-btn:hover{ background: rgba(154,75,75,0.1); }

  footer{
    text-align:center;
    color: var(--text-dim);
    font-size: 11px;
    margin-top: 22px;
    letter-spacing: 1px;
  }

  @media (max-width: 560px){
    #character-panel{ font-size: 12px; grid-template-columns: repeat(2, 1fr); }
    #story-log{ font-size: 14px; padding: 16px; }
  }

  @media (prefers-reduced-motion: reduce){
    .cursor{ animation: none; opacity: 1; }
    .choice-btn{ transition: none; }
  }
</style>
</head>
<body>

<div id="game-container">
  <header>
    <div class="seal">廢</div>
    <h1>PHẾ VẬT NGHỊCH TẬP</h1>
  </header>
  <div class="divider"></div>

  <div id="character-panel">
    <div class="stat">
      <span class="label">Đạo Hiệu</span>
      <span class="value" id="stat-name">—</span>
    </div>
    <div class="stat realm">
      <span class="label">Cảnh Giới</span>
      <span class="value" id="stat-realm">—</span>
    </div>
    <div class="stat root">
      <span class="label">Linh Căn</span>
      <span class="value" id="stat-root">—</span>
    </div>
    <div class="stat">
      <span class="label">Thọ Nguyên</span>
      <span class="value" id="stat-life">—</span>
    </div>
    <div class="stat stone">
      <span class="label">Linh Thạch</span>
      <span class="value" id="stat-stone">—</span>
    </div>
    <div class="stat">
      <span class="label">Túi Đồ</span>
      <span class="value" id="stat-inventory">Trống</span>
    </div>
  </div>

  <div id="story-log" aria-live="polite"></div>

  <div id="choices-panel"></div>
  <button id="restart-btn">↺ Chơi Lại Từ Đầu</button>

  <footer>Chương 1: Trục Xuất — Demo Text-based Cultivation Game</footer>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     1. STATE MANAGER
  ========================================================= */
  const StateManager = {
    player: {
      name: "Lâm Phàm",
      realm: "Luyện Khí Kỳ - Tầng 1",
      linhCan: "Phế Linh Căn (Ngũ Hành Câm Linh Căn)",
      tho: 92,
      linhThach: 3,
      inventory: []
    },
    currentNode: "start",

    addItem(item){
      this.player.inventory.push(item);
    },

    setStat(key, value){
      this.player[key] = value;
    },

    modifyStat(key, delta){
      if (typeof this.player[key] === "number"){
        this.player[key] += delta;
      }
    },

    reset(){
      this.player = {
        name: "Lâm Phàm",
        realm: "Luyện Khí Kỳ - Tầng 1",
        linhCan: "Phế Linh Căn (Ngũ Hành Câm Linh Căn)",
        tho: 92,
        linhThach: 3,
        inventory: []
      };
      this.currentNode = "start";
    }
  };

  /* =========================================================
     2. NODE TREE — CỐT TRUYỆN CHƯƠNG 1
  ========================================================= */
  const nodeTree = {

    start: {
      chapterTitle: "CHƯƠNG 1: TRỤC XUẤT",
      lines: [
        {type:"narration", text:"Đại điện Thanh Vân Tông tĩnh lặng đến rợn người. Hàng trăm đệ tử đứng hai bên, không ai dám thở mạnh."},
        {type:"narration", text:"Lâm Phàm quỳ giữa điện, máu khô trên khóe môi. Ba ngày trước, ngươi vẫn còn là thiên tài được cả tông môn kỳ vọng — cho đến khi kỳ kiểm tra linh căn ba năm một lần chứng minh ngươi mang Ngũ Hành Câm Linh Căn, vạn năm khó gặp một kẻ phế vật như vậy."},
        {type:"narration", text:"Trên cao, Tông chủ Diệp Thanh Sơn lạnh giọng: \"Phế linh căn thì không xứng làm đệ tử Thanh Vân Tông. Hôn ước với Nhị tiểu thư Vân gia, ngươi cũng không xứng giữ nữa — nhường lại cho sư đệ Triệu Húc Nhật.\""},
        {type:"narration", text:"Triệu Húc Nhật đứng cạnh Vân Nhược Nhi, khóe miệng nhếch lên đầy đắc ý. Nhược Nhi cúi đầu, không dám nhìn ngươi."},
        {type:"system", text:"[Trạng thái: Bị phế trừ tư cách đệ tử — bị hủy hôn ước — trục xuất khỏi tông môn]"},
        {type:"narration", text:"\"Từ nay,\" Tông chủ phất tay áo, \"Lâm Phàm không còn liên quan gì đến Thanh Vân Tông. Cút khỏi núi trước hoàng hôn, nếu không, đừng trách bản tông vô tình.\""},
        {type:"narration", text:"Gió lạnh thổi qua đại điện. Trong khoảnh khắc ấy, ngươi phải chọn: nuốt nhục ra đi, hay để cơn giận trong lòng bùng cháy lần cuối..."}
      ],
      choices: [
        { label: "Im lặng nhẫn nhịn, âm thầm rời đi.", next: "forest_entry" },
        { label: "Phản kháng, mắng chửi rồi nhảy vực.", next: "cliff_jump" }
      ]
    },

    /* ============ NHÁNH A: NHẪN NHỊN — HẮC PHONG SÂM LÂM ============ */
    forest_entry: {
      lines: [
        {type:"narration", text:"Ngươi cắn chặt răng, cúi đầu quay lưng bước đi. Không một lời biện minh, không một giọt nước mắt — chỉ có ánh mắt lạnh như băng nhìn thẳng về phía trước."},
        {type:"system", text:"[Thọ Nguyên -2: chấn thương nội phủ do bị đánh trọng thương trước khi trục xuất]"},
        {type:"narration", text:"Sau ba ngày lang thang, ngươi lạc vào Hắc Phong Sâm Lâm — khu rừng nổi tiếng u ám, nơi yêu thú cấp thấp lẫn tàn tích thượng cổ đan xen. Không ai ngờ một phế vật lại dám bước vào đây."},
        {type:"narration", text:"Trời sắp tối, sương mù dày đặc bò là là trên mặt đất. Trước mắt ngươi, một miệng hang đá bị dây leo che khuất gần như hoàn toàn hiện ra sau tia sét vừa lóe lên."}
      ],
      choices: [
        { label: "Tiến vào hang động khám phá.", next: "cave_discovery" },
        { label: "Cảnh giác, đốt lửa trại nghỉ chân bên ngoài trước.", next: "campfire_rest" }
      ]
    },

    campfire_rest: {
      lines: [
        {type:"narration", text:"Ngươi quyết định thận trọng. Nhóm một đống lửa nhỏ, dựa lưng vào tảng đá, mắt không rời miệng hang tối om."},
        {type:"narration", text:"Đêm khuya, một luồng linh khí mỏng manh bất chợt thoát ra từ khe đá trong hang, tan vào không khí rồi biến mất. Ngươi giật mình — nơi ấy không hề đơn giản."},
        {type:"system", text:"[Thọ Nguyên -1: một đêm không ngủ giữa rừng hoang]"}
      ],
      choices: [
        { label: "Không chần chừ nữa, tiến vào hang ngay khi trời sáng.", next: "cave_discovery" }
      ]
    },

    cave_discovery: {
      lines: [
        {type:"narration", text:"Hang động sâu hun hút, vách đá phủ đầy rêu phong cả ngàn năm. Càng đi sâu, luồng linh khí kỳ lạ càng rõ rệt — thứ linh khí này khác hẳn linh khí ngươi từng cảm nhận, âm trầm mà cổ xưa."},
        {type:"narration", text:"Cuối hang là một mật thất nhỏ. Giữa mật thất, một bộ xương khô ngồi kiết già, trước ngực là một quyển sách da thú đã ố vàng và một chiếc bình ngọc nhỏ phát ra ánh sáng mờ nhạt."},
        {type:"system", text:"[Phát hiện: Tàn Khuyết Công Pháp — 《Huyền Âm Tức Tức Quyết》 (thiếu mất chương cuối)]"},
        {type:"system", text:"[Phát hiện: Nhất phẩm đan dược — Tẩy Tủy Đan (đã hóa thạch một phần, hiệu quả giảm đi nhưng vẫn còn dùng được)]"},
        {type:"narration", text:"Trong đầu ngươi bỗng vang lên một giọng nói mơ hồ, như tàn niệm cuối cùng còn sót lại của chủ nhân bộ xương: \"Câm linh căn... không phải là tuyệt lộ. Đó là linh căn bị phong ấn... Nếu tìm được cách giải phong ấn... ha... ha...\""},
        {type:"narration", text:"Giọng nói tan biến. Ngươi run rẩy nắm chặt quyển tàn quyết trong tay — đây có lẽ chính là cơ duyên đầu tiên trên con đường nghịch tập."}
      ],
      choices: [
        { label: "Lập tức ngồi xuống, thử vận chuyển công pháp tàn khuyết.", next: "chapter1_end_a" }
      ]
    },

    chapter1_end_a: {
      lines: [
        {type:"narration", text:"Ngươi ngồi kiết già giữa mật thất, chậm rãi vận chuyển từng câu quyết trong 《Huyền Âm Tức Tức Quyết》. Một luồng khí lạnh len lỏi qua đan điền — nơi vốn dĩ trống rỗng suốt mười tám năm qua."},
        {type:"narration", text:"Lần đầu tiên trong đời, ngươi cảm nhận được một tia linh khí, dù nhỏ bé đến đáng thương, đang chảy trong cơ thể mình."},
        {type:"system", text:"[Nhận được vật phẩm: Huyền Âm Tức Tức Quyết (Tàn Khuyết)]"},
        {type:"system", text:"[Nhận được vật phẩm: Tẩy Tủy Đan (Hóa Thạch)]"},
        {type:"narration", text:"Thanh Vân Tông đã ruồng bỏ ngươi. Nhưng Hắc Phong Sâm Lâm, trong bóng tối lạnh lẽo của nó, lại vừa mở ra cánh cửa đầu tiên trên con đường nghịch thiên..."},
        {type:"system", text:"— Hết Chương 1 (Nhánh Nhẫn Nhịn) — Cảm ơn bạn đã trải nghiệm bản demo —"}
      ],
      choices: []
    },

    /* ============ NHÁNH B: PHẢN KHÁNG — NHẢY VỰC ============ */
    cliff_jump: {
      lines: [
        {type:"narration", text:"\"Phế vật thì sao?!\" Ngươi ngẩng đầu, gào lên giữa đại điện, tiếng vang dội khắp bốn phía. \"Thanh Vân Tông các người, có mắt như mù! Hôm nay ta thua, nhưng tổ tông ba đời các người, tổng có ngày phải cúi đầu nhìn ta!\""},
        {type:"narration", text:"Triệu Húc Nhật cười lạnh, sải bước tới định ra tay lần nữa. Ngươi không né tránh — thay vào đó, ngươi lao thẳng ra khỏi đại điện, chạy về phía vách núi sau tông môn, nơi vực sâu Vô Để Nhai nổi tiếng không đáy."},
        {type:"system", text:"[Cảnh báo: Hành động cực đoan — rủi ro cao]"},
        {type:"narration", text:"\"Sống làm phế vật bị người khinh rẻ, chi bằng chết cũng phải chết cho ra dáng!\" Ngươi hét lên câu cuối cùng, rồi buông mình lao xuống vực sâu không đáy."}
      ],
      choices: [
        { label: "Nhắm mắt buông xuôi, phó mặc số mệnh.", next: "abyss_landing" },
        { label: "Gắng gượng vận sức, cố kiểm soát hướng rơi.", next: "abyss_control" }
      ]
    },

    abyss_control: {
      lines: [
        {type:"narration", text:"Dù linh căn bị phế, thân thể ngươi vẫn được tôi luyện nhiều năm. Ngươi xoay người giữa không trung, hai tay bấu vào từng mỏm đá lồi ra trên vách vực, làm chậm lại tốc độ rơi."},
        {type:"system", text:"[Thọ Nguyên -3: toàn thân trầy xước, gân cốt tổn thương]"},
        {type:"narration", text:"Cuối cùng ngươi cũng rơi xuống một mỏm đá nhô ra giữa vực, thay vì lao thẳng xuống đáy. Trước mắt là một hắc động khép hờ, phát ra thứ ánh sáng âm u kỳ dị."}
      ],
      choices: [
        { label: "Bước vào hắc động giữa vực sâu.", next: "abyss_soul" }
      ]
    },

    abyss_landing: {
      lines: [
        {type:"narration", text:"Ngươi nhắm mắt, để mặc thân thể rơi tự do trong bóng tối vô tận. Gió rít bên tai, ý thức dần mơ hồ..."},
        {type:"narration", text:"Không biết đã rơi bao lâu, một lớp mạng nhện linh khí kỳ dị giăng ngang lòng vực bỗng hứng lấy thân thể ngươi, hóa giải phần lớn lực rơi trước khi ngươi bất tỉnh."},
        {type:"system", text:"[Thọ Nguyên -5: trọng thương, may mắn thoát chết trong đường tơ kẽ tóc]"},
        {type:"narration", text:"Khi tỉnh lại, ngươi thấy mình đang nằm trong một hắc động ẩm thấp sâu dưới đáy Vô Để Nhai, xung quanh là những phù văn cổ xưa phát sáng lờ mờ."}
      ],
      choices: [
        { label: "Gắng gượng đứng dậy, dò xét xung quanh.", next: "abyss_soul" }
      ]
    },

    abyss_soul: {
      lines: [
        {type:"narration", text:"Giữa hắc động, một làn khói đen mỏng manh vụt hiện lên, dần dần kết thành hình dáng một lão giả mặc chiến bào rách nát, toàn thân trong suốt — một tàn hồn tồn tại đã không biết bao nhiêu năm."},
        {type:"narration", text:"\"Ha... cuối cùng cũng có người rơi tới đây...\" Tàn hồn cất giọng khàn đục như từ đáy mộ vọng lên. \"Ngươi mang trong người khí tức Câm Linh Căn... thú vị, thú vị lắm.\""},
        {type:"narration", text:"\"Lão phu vốn là Chấp Kiếm Trưởng Lão của một đại tông môn đã diệt vong vạn năm trước. Trước khi hồn phi phách tán, lão phu để lại một kiếm ý tàn dư, cùng một dị bảo áp thân — Nếu ngươi đủ gan dạ tiếp nhận, những thứ này là của ngươi.\""},
        {type:"system", text:"[Tiền bối tàn hồn xuất hiện: Chấp Kiếm Tàn Hồn]"},
        {type:"narration", text:"Trước mặt ngươi, một chiếc nhẫn sắt đen cũ kỹ, khắc đầy hoa văn kiếm quang mờ nhạt, từ từ trôi tới, đáp xuống lòng bàn tay ngươi."},
        {type:"system", text:"[Nhận được dị bảo: Tàng Phong Giới Chỉ — không gian thu nạp bí ẩn, bên trong phong ấn một tia Kiếm Ý tàn dư]"},
        {type:"narration", text:"Tàn hồn khẽ cười, thân hình bắt đầu tan loãng: \"Câm Linh Căn của ngươi... không phải phế vật. Đó là dấu tích của một loại thể chất thất truyền... Đi đi, ra khỏi nơi này, con đường tu tiên của ngươi mới chỉ vừa bắt đầu...\""}
      ],
      choices: [
        { label: "Quỳ xuống bái tạ tiền bối, tiếp nhận dị bảo.", next: "chapter1_end_b" }
      ]
    },

    chapter1_end_b: {
      lines: [
        {type:"narration", text:"Ngươi cung kính dập đầu ba lạy về phía làn khói đen đang tan biến dần. Khi ngẩng đầu lên, tàn hồn đã hoàn toàn biến mất, chỉ còn Tàng Phong Giới Chỉ lặng lẽ nằm trong lòng bàn tay, ấm áp lạ thường."},
        {type:"system", text:"[Nhận được vật phẩm: Tàng Phong Giới Chỉ (chứa Kiếm Ý tàn dư)]"},
        {type:"narration", text:"Thanh Vân Tông tưởng rằng đẩy ngươi xuống vực là kết thúc. Nhưng vực sâu này, lại chính là khởi đầu cho một Phế Vật Nghịch Tập không ai ngờ tới..."},
        {type:"system", text:"— Hết Chương 1 (Nhánh Phản Kháng) — Cảm ơn bạn đã trải nghiệm bản demo —"}
      ],
      choices: []
    }
  };

  /* =========================================================
     3. RENDER ENGINE
  ========================================================= */
  const dom = {
    log: document.getElementById("story-log"),
    choices: document.getElementById("choices-panel"),
    restartBtn: document.getElementById("restart-btn"),
    name: document.getElementById("stat-name"),
    realm: document.getElementById("stat-realm"),
    root: document.getElementById("stat-root"),
    life: document.getElementById("stat-life"),
    stone: document.getElementById("stat-stone"),
    inventory: document.getElementById("stat-inventory")
  };

  const TYPE_SPEED = 18; // ms per character

  function renderCharacterPanel(){
    const p = StateManager.player;
    dom.name.textContent = p.name;
    dom.realm.textContent = p.realm;
    dom.root.textContent = p.linhCan;
    dom.life.textContent = p.tho + " năm";
    dom.stone.textContent = p.linhThach + " viên";
    dom.inventory.textContent = p.inventory.length
      ? p.inventory.join(", ")
      : "Trống";
  }

  function typeLine(el, text, speed){
    return new Promise((resolve) => {
      let i = 0;
      const cursor = document.createElement("span");
      cursor.className = "cursor";
      el.appendChild(cursor);

      function step(){
        if (i < text.length){
          cursor.insertAdjacentText("beforebegin", text.charAt(i));
          i++;
          dom.log.scrollTop = dom.log.scrollHeight;
          setTimeout(step, speed);
        } else {
          cursor.remove();
          resolve();
        }
      }
      step();
    });
  }

  async function playLines(lines){
    for (const line of lines){
      const el = document.createElement("div");
      el.className = "log-line " + (line.type || "narration");
      dom.log.appendChild(el);
      const speed = line.type === "system" ? TYPE_SPEED * 0.6 : TYPE_SPEED;
      await typeLine(el, line.text, speed);
    }
  }

  function renderChoices(choices, disableAll){
    dom.choices.innerHTML = "";
    if (!choices || choices.length === 0){
      dom.restartBtn.style.display = "inline-block";
      return;
    }
    dom.restartBtn.style.display = "none";
    choices.forEach((choice) => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.disabled = !!disableAll;
      btn.innerHTML = '<span class="arrow">▸</span><span>' + choice.label + '</span>';
      btn.addEventListener("click", () => goToNode(choice.next));
      dom.choices.appendChild(btn);
    });
  }

  async function goToNode(nodeId){
    const node = nodeTree[nodeId];
    if (!node) return;

    StateManager.currentNode = nodeId;
    renderChoices([], true); // lock while typing

    if (node.chapterTitle){
      const titleEl = document.createElement("div");
      titleEl.className = "log-line chapter-title";
      titleEl.textContent = node.chapterTitle;
      dom.log.appendChild(titleEl);
    }

    await playLines(node.lines);
    applyNodeEffects(nodeId);
    renderCharacterPanel();
    renderChoices(node.choices, false);
  }

  function applyNodeEffects(nodeId){
    // Gắn hiệu ứng thay đổi state theo từng node cụ thể (item / stat)
    const effects = {
      forest_entry: () => StateManager.modifyStat("tho", -2),
      campfire_rest: () => StateManager.modifyStat("tho", -1),
      cave_discovery: () => {
        StateManager.addItem("Huyền Âm Tức Tức Quyết (Tàn Khuyết)");
        StateManager.addItem("Tẩy Tủy Đan (Hóa Thạch)");
      },
      abyss_control: () => StateManager.modifyStat("tho", -3),
      abyss_landing: () => StateManager.modifyStat("tho", -5),
      abyss_soul: () => StateManager.addItem("Tàng Phong Giới Chỉ"),
    };
    if (effects[nodeId]) effects[nodeId]();
  }

  /* =========================================================
     4. INIT / RESTART
  ========================================================= */
  function startGame(){
    dom.log.innerHTML = "";
    renderCharacterPanel();
    goToNode("start");
  }

  dom.restartBtn.addEventListener("click", () => {
    StateManager.reset();
    dom.restartBtn.style.display = "none";
    startGame();
  });

  startGame();

})();
</script>
