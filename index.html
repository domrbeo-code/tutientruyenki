                            <button key={f.id} onClick={() => setInvFilter(f.id)}
                              style={{ padding:'6px 12px', borderRadius:'8px', fontSize:'10px', fontFamily:'Cinzel,serif', fontWeight:700, cursor:'pointer', transition:'all 0.15s',
                                background: invFilter === f.id ? 'linear-gradient(135deg, rgba(100,40,180,0.5), rgba(60,20,120,0.6))' : 'rgba(20,10,40,0.6)',
                                border: `1px solid ${invFilter === f.id ? 'rgba(192,132,252,0.5)' : 'rgba(100,60,180,0.25)'}`,
                                color: invFilter === f.id ? '#f5c842' : 'rgba(180,160,220,0.5)' }}>
                              {f.label}
                            </button>
                          ))}
                        </div>
                        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(180px, 1fr))', gap:'10px', maxHeight:'380px', overflowY:'auto' }} className="no-scrollbar inventory-grid">
                        {gameState.inventory.filter(item => {
                          if (invFilter === 'all') return true;
                          const g = ALL_GEARS.find(g => g.id === item.gearId);
                          return g && g.type === invFilter;
                        }).map(item => {
                          const gear = ALL_GEARS.find(g => g.id === item.gearId);
                          if (!gear) return null;
                          return (
                            <div key={item.uniqueId} className={`item-card${item.isEquipped ? ' equipped' : ''}`} style={{ display:'flex', flexDirection:'column', justifyContent:'space-between', gap:'10px' }}>
                              <div>
                                <div style={{ fontSize:'24px', marginBottom:'6px', filter:`drop-shadow(0 0 8px ${item.isEquipped ? 'rgba(245,200,66,0.6)' : 'rgba(99,102,241,0.4)'})` }}>{gear.icon || '⚔️'}</div>
                                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'4px' }}>
                                  <span className={gear.colorClass} style={{ fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'12px' }}>{gear.name}</span>
                                  {item.isEquipped && <span style={{ fontSize:'9px', color:'#f5c842', background:'rgba(92,60,10,0.5)', border:'1px solid rgba(245,200,66,0.4)', padding:'1px 6px', borderRadius:'10px' }}>장착중</span>}
                                </div>
                                <div style={{ fontSize:'9px', padding:'2px 6px', background:'rgba(0,0,0,0.4)', borderRadius:'6px', color:'rgba(180,160,220,0.6)', display:'inline-block', marginBottom:'5px' }}>{gear.tier} · {gear.type === 'weapon' ? '🗡️ Vũ Khí' : gear.type === 'armor' ? '🛡️ Trang Bị' : '💍 Pháp Bảo'}</div>
                                <div style={{ fontSize:'10px', color:'#67e8f9', lineHeight:1.5 }}>
                                  {gear.clickBonus > 0 && <div>⚔️ +{gear.clickBonus} Chiến Lực</div>}
                                  {gear.qpsBonus > 0 && <div>⚡ +{gear.qpsBonus} Qi/s</div>}
                                </div>
                              </div>
                              <button onClick={() => toggleEquipInventoryItem(item.uniqueId)}
                                style={{ width:'100%', padding:'7px', borderRadius:'8px', fontFamily:'Cinzel,serif', fontSize:'10px', fontWeight:700, cursor:'pointer', transition:'all 0.15s',
                                  background: item.isEquipped ? 'linear-gradient(135deg, rgba(92,60,10,0.6), rgba(55,35,5,0.7))' : 'linear-gradient(135deg, rgba(60,20,110,0.5), rgba(35,12,70,0.6))',
                                  border: `1px solid ${item.isEquipped ? 'rgba(245,200,66,0.5)' : 'rgba(139,92,246,0.4)'}`,
                                  color: item.isEquipped ? '#f5c842' : '#c084fc' }}>
                                {item.isEquipped ? '✦ Đang Trang Bị' : '⬆ Trang Bị'}
                              </button>
                            </div>
                          );
                        })}
                        </div>
                      </React.Fragment>
                    )}
                  </div>
                )}

                {/* ─── VẬT PHẨM TAB ─── */}
                {activeTab === 'items' && (
                  <div style={{ display:'flex', flexDirection:'column', gap:'16px' }}>
                    <div>
                      <div style={{ fontFamily:'Cinzel Decorative,serif', fontSize:'16px', fontWeight:700, color:'#f5c842', marginBottom:'4px' }} className="section-title">🧪 Vật Phẩm & Đan Dược</div>
                      <div className="ornament-divider" style={{ margin:'8px 0' }}>ĐAN DƯỢC HỘ THÂN & LINH PHÙ</div>
                      <div style={{ fontSize:'11px', color:'rgba(160,140,200,0.6)' }}>Nhận từ Bí Cảnh hoặc mua tại đây. Đan hồi Linh Khí dùng bất cứ lúc nào; Linh Phù hộ thân chỉ dùng được khi đang Độ Kiếp.</div>
                    </div>
                    <div className="items-grid items-grid" style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(210px, 1fr))', gap:'12px' }}>
                      {ALL_ITEMS.map(consumable => {
                        const count = gameState.items[consumable.id] || 0;
                        const canBuy = consumable.price && gameState.qi >= consumable.price;
                        const canUse = count > 0;
                        return (
                          <div key={consumable.id} className="item-card" style={{ display:'flex', flexDirection:'column', justifyContent:'space-between', gap:'10px' }}>
                            <div>
                              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
                                <div style={{ fontSize:'26px', marginBottom:'6px' }}>{consumable.icon}</div>
                                <span style={{ fontSize:'10px', padding:'2px 8px', background:'rgba(76,29,149,0.4)', border:'1px solid rgba(139,92,246,0.4)', borderRadius:'20px', color:'#c084fc', fontWeight:700 }}>×{count}</span>
                              </div>
                              <div className={consumable.colorClass} style={{ fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'12px', marginBottom:'3px' }}>{consumable.name}</div>
                              <div style={{ fontSize:'9px', padding:'2px 6px', background:'rgba(0,0,0,0.4)', borderRadius:'6px', color:'rgba(180,160,220,0.6)', display:'inline-block', marginBottom:'5px' }}>{consumable.tier}</div>
                              <p style={{ fontSize:'10px', color:'rgba(160,140,200,0.6)', lineHeight:1.5, marginBottom:'4px' }}>{consumable.desc}</p>
                              <div style={{ fontSize:'10px', color:'#67e8f9' }}>
                                {consumable.type === 'qi' ? `⚡ Hồi +${formatNumber(consumable.value)} Linh Khí` : `🛡️ Hồi ${Math.floor(consumable.value * 100)}% Sinh Mệnh Độ Kiếp`}
                              </div>
                            </div>
                            <div style={{ display:'flex', flexDirection:'column', gap:'6px' }}>
                              {consumable.price ? (
                                <button onClick={() => buyConsumableItem(consumable.id)} disabled={!canBuy} className="btn-gold"
                                  style={{ width:'100%', padding:'7px', borderRadius:'8px', fontFamily:'Cinzel,serif', fontSize:'10px', fontWeight:700, cursor: canBuy ? 'pointer' : 'not-allowed', opacity: canBuy ? 1 : 0.4 }}>
                                  {canBuy ? '✦ ' : '🔒 '}Mua — {formatNumber(consumable.price)} Qi
                                </button>
                              ) : (
                                <div style={{ textAlign:'center', fontSize:'9px', color:'rgba(150,140,170,0.5)' }}>Chỉ rớt ra từ Bí Cảnh</div>
                              )}
                              <button onClick={() => useConsumableItem(consumable.id)} disabled={!canUse} className="btn-primary" style={{ opacity: canUse ? 1 : 0.4, cursor: canUse ? 'pointer' : 'not-allowed' }}>
                                Sử Dụng
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* ─── COMBAT TAB (BÍ CẢNH) ─── */}
                {activeTab === 'combat' && (

                      <div style={{ fontFamily:'Cinzel Decorative,serif', fontSize:'16px', fontWeight:700, color:'#f5c842', marginBottom:'4px' }} className="section-title">🌀 Bí Cảnh Thám Hiểm</div>

                    </div>

                    {/* Solo / Tổ Đội switcher */}
                    <div className="combat-subtabs" style={{ display:'flex', gap:'6px' }}>
                      {[{ id:'solo', label:'🧍 Solo' }, { id:'team', label:'👥 Tổ Đội (Nhiều Người Thật)' }].map(st => (
                        <button key={st.id} onClick={() => setCombatSubTab(st.id)}
                          style={{ padding:'8px 16px', borderRadius:'8px', fontSize:'11px', fontFamily:'Cinzel,serif', fontWeight:700, cursor:'pointer',
                            background: combatSubTab === st.id ? 'linear-gradient(135deg, rgba(100,40,180,0.5), rgba(60,20,120,0.6))' : 'rgba(20,10,40,0.6)',
                            border: `1px solid ${combatSubTab === st.id ? 'rgba(192,132,252,0.5)' : 'rgba(100,60,180,0.25)'}`,

                          <div style={{ textAlign:'center' }}>
                            <div style={{ fontFamily:'Cinzel,serif', fontWeight:900, fontSize:'18px', color:'#f5e6c8', marginBottom:'4px', textShadow:`0 0 20px ${activeBcDef?.color}60` }}>
                              {activeBcDef?.name}
                            </div>
                            <div style={{ fontSize:'11px', color:'#67e8f9' }}>
                              Còn lại {bcTimeLeftSec}s • Vượt qua để nhận +{formatNumber(activeBcDef?.reward || 0)} Linh Khí
                            </div>
                          </div>
                          <div style={{ width:'100%', maxWidth:'360px' }}>
                            <div style={{ display:'flex', justifyContent:'space-between', fontSize:'11px', marginBottom:'5px' }}>
                              <span style={{ color:'rgba(220,180,180,0.7)' }}>💔 Sinh Mệnh Của Bạn</span>
                              <span style={{ color:'#fca5a5', fontWeight:700 }}>{Math.ceil(bcCurrentHp)} / {biCanhRun.maxHp}</span>
                            </div>
                            <div className="hp-bar-track">
                              <div className="hp-bar-fill" style={{ width:`${bcHpPercent}%` }}></div>
                            </div>
                          </div>

                            style={{ width:'100%', maxWidth:'360px', padding:'12px', borderRadius:'12px', fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'12px', letterSpacing:'0.5px', cursor:'pointer' }}>
                            🚪 Rút Lui An Toàn (Không Nhận Thưởng)
                          </button>
                        </div>

                            <div key={bc.id} className="item-card" style={{ display:'flex', flexDirection:'column', justifyContent:'space-between', gap:'10px', border:`1px solid ${bc.color}55` }}>
                              <div>
                                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
                                  <div style={{ fontSize:'30px' }}>{bc.icon}</div>
                                  <span style={{ fontSize:'9px', padding:'2px 8px', borderRadius:'20px', fontWeight:700, background:'rgba(168,85,247,0.25)', border:'1px solid rgba(192,132,252,0.4)', color:'#d8b4fe' }}>
                                    🧍 Solo
                                  </span>
                                </div>
                                <div style={{ fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'13px', color: bc.color, margin:'6px 0 3px' }}>{bc.name}</div>
                                <div style={{ fontSize:'9px', padding:'2px 6px', background:'rgba(0,0,0,0.4)', borderRadius:'6px', color:'rgba(180,160,220,0.6)', display:'inline-block', marginBottom:'6px' }}>{bc.tier} · {bc.duration}s</div>
                                <p style={{ fontSize:'10px', color:'rgba(160,140,200,0.6)', lineHeight:1.5, marginBottom:'6px' }}>{bc.desc}</p>
                                <div style={{ fontSize:'10px', color:'#67e8f9', lineHeight:1.6 }}>
                                  <div>⚡ +{formatNumber(bc.reward)} Linh Khí</div>
                                  <div>🎁 {bc.dropRolls} lượt rớt đồ khi thành công</div>
                                  <div>💔 Mất {Math.floor(bc.failPenaltyPercent * 100)}% Qi hiện có nếu thất bại</div>
                                </div>
                              </div>
                              <button onClick={() => enterBiCanh(bc.id)}
                                style={{ width:'100%', padding:'10px', borderRadius:'10px', fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'11px', letterSpacing:'0.5px', cursor:'pointer',
                                  background: `linear-gradient(135deg, ${bc.color}33, ${bc.color}1a)`, border:`1px solid ${bc.color}66`, color: bc.color }}>
                                ⚔️ Tiến Vào Bí Cảnh
                              </button>
                            </div>
                          ))}
                        </div>
                      )
                    ) : (
                      /* ═══════════ TỔ ĐỘI: nhiều người chơi thật đồng bộ qua cloud ═══════════ */
                      myTeamRun && myLobby ? (
                        myLobby.status === 'waiting' ? (
                          /* Phòng chờ */
                          <div className="monster-arena" style={{ flex:1, maxHeight:'520px', overflowY:'auto' }}>
                            <div style={{ fontSize:'56px', textAlign:'center' }}>{myTeamBcDef?.icon}</div>
                            <div style={{ textAlign:'center' }}>
                              <div style={{ fontFamily:'Cinzel,serif', fontWeight:900, fontSize:'16px', color:'#f5e6c8' }}>{myTeamBcDef?.name}</div>
                              <div style={{ fontSize:'11px', color:'#67e8f9' }}>Đang chờ đồng đội... ({myLobby.members.length}/4)</div>
                            </div>
                            <div style={{ width:'100%', maxWidth:'360px', maxHeight:'160px', overflowY:'auto', display:'flex', flexDirection:'column', gap:'6px' }} className="no-scrollbar">
                              {myLobby.members.map(m => (
                                <div key={m.name} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 12px', background:'rgba(30,15,55,0.5)', border:'1px solid rgba(139,92,246,0.25)', borderRadius:'8px', fontSize:'11px' }}>
                                  <span style={{ color:'#e9d5ff' }}>{m.name === myLobby.hostName ? '👑 ' : '⚔️ '}{m.name}{m.name === playerName ? ' (Bạn)' : ''}</span>
                                  <span style={{ color:'#86efac' }}>Sẵn sàng</span>
                                </div>
                              ))}
                            </div>
                            <div style={{ fontSize:'10px', color:'rgba(160,140,200,0.5)', textAlign:'center' }}>Cần tối thiểu 2 người để bắt đầu • Càng đông càng giảm hao tổn sinh mệnh</div>
                            <div style={{ display:'flex', gap:'10px', width:'100%', maxWidth:'360px', position:'relative', zIndex:1, pointerEvents:'auto', flexShrink:0 }}>
                              <button type="button" onClick={leaveTeamLobby} className="btn-danger" style={{ flex:1, padding:'12px', borderRadius:'12px', fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'11px', cursor:'pointer', position:'relative', zIndex:1 }}>
                                🚪 Rời Phòng
                              </button>
                              <button type="button" onClick={startTeamLobby} disabled={myLobby.members.length < 2}
                                style={{ flex:1, padding:'12px', borderRadius:'12px', fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'11px', cursor: myLobby.members.length < 2 ? 'not-allowed' : 'pointer', opacity: myLobby.members.length < 2 ? 0.4 : 1,
                                  background:'linear-gradient(135deg, #166534, #052e16)', border:'1px solid rgba(74,222,128,0.5)', color:'#bbf7d0', position:'relative', zIndex:1 }}>
                                ▶ Bắt Đầu
                              </button>
                            </div>
                          </div>
                        ) : (
                          /* Đang diễn ra / đã kết thúc — theo dõi tiến trình mọi thành viên theo thời gian thực */
                          <div className="monster-arena" style={{ flex:1 }}>
                            <div style={{ fontSize:'56px', textAlign:'center', filter:`drop-shadow(0 0 20px ${myTeamBcDef?.color})` }}>{myTeamBcDef?.icon}</div>
                            <div style={{ textAlign:'center' }}>
                              <div style={{ fontFamily:'Cinzel,serif', fontWeight:900, fontSize:'16px', color:'#f5e6c8' }}>{myTeamBcDef?.name}</div>
                              <div style={{ fontSize:'11px', color:'#67e8f9' }}>
                                {myLobby.status === 'active' ? `Còn lại ${myTeamTimeLeftSec}s` : 'Trận đấu đã kết thúc'}
                                {myLobbyMe?.status === 'success' ? ' • Bạn đã hoàn thành!' : myLobbyMe?.status === 'dead' ? ' • Bạn đã ngã xuống!' : ''}
                              </div>
                            </div>
                            <div style={{ width:'100%', maxWidth:'400px', display:'flex', flexDirection:'column', gap:'8px' }}>
                              {myLobby.members.map(m => {
                                const mMaxHp = myTeamBcDef?.maxHp || 100;
                                const mHp = computeMemberHp(myLobby, m, mMaxHp);
                                const mHpPercent = Math.max(0, Math.min(100, (mHp / mMaxHp) * 100));
                                return (
                                  <div key={m.name} style={{ display:'flex', flexDirection:'column', gap:'3px' }}>
                                    <div style={{ display:'flex', justifyContent:'space-between', fontSize:'10px' }}>
                                      <span style={{ color: m.name === playerName ? '#f5c842' : 'rgba(220,180,220,0.7)' }}>
                                        {m.status === 'success' ? '✅ ' : m.status === 'dead' ? '💀 ' : '⚔️ '}{m.name}{m.name === playerName ? ' (Bạn)' : ''}
                                      </span>
                                      <span style={{ color:'#fca5a5' }}>{Math.ceil(mHp)} / {mMaxHp}</span>
                                    </div>
                                    <div className="hp-bar-track">
                                      <div className="hp-bar-fill" style={{ width:`${mHpPercent}%`, opacity: m.status === 'alive' ? 1 : 0.4 }}></div>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                            {myLobbyMe?.status !== 'alive' && (
                              <button onClick={leaveTeamLobby}
                                style={{ width:'100%', maxWidth:'360px', padding:'10px', borderRadius:'10px', fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'11px', cursor:'pointer', background:'rgba(40,40,60,0.6)', border:'1px solid rgba(150,140,170,0.3)', color:'rgba(200,180,220,0.7)' }}>
                                Rời Phòng
                              </button>
                            )}
                          </div>
                        )
                      ) : (
                        /* Chưa vào phòng nào — tạo phòng mới hoặc tham gia phòng đang chờ */
                        <div style={{ display:'flex', flexDirection:'column', gap:'18px', overflowY:'auto' }} className="no-scrollbar">
                          <div>
                            <div style={{ fontSize:'11px', fontFamily:'Cinzel,serif', fontWeight:700, color:'#93c5fd', marginBottom:'8px' }}>➕ Tạo Phòng Mới</div>
                            <div className="titles-grid" style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(220px, 1fr))', gap:'12px' }}>
                              {BI_CANH_LIST.filter(bc => bc.type === 'team').map(bc => (
                                <div key={bc.id} className="item-card" style={{ display:'flex', flexDirection:'column', justifyContent:'space-between', gap:'10px', border:`1px solid ${bc.color}55` }}>
                                  <div>
                                    <div style={{ fontSize:'28px' }}>{bc.icon}</div>
                                    <div style={{ fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'13px', color:bc.color, margin:'6px 0 3px' }}>{bc.name}</div>
                                    <div style={{ fontSize:'9px', padding:'2px 6px', background:'rgba(0,0,0,0.4)', borderRadius:'6px', color:'rgba(180,160,220,0.6)', display:'inline-block', marginBottom:'6px' }}>{bc.tier} · {bc.duration}s · Tối đa 4 người</div>
                                    <div style={{ fontSize:'10px', color:'#67e8f9', lineHeight:1.6 }}>
                                      <div>⚡ +{formatNumber(bc.reward)} Linh Khí (thưởng thêm theo số người)</div>
                                      <div>🎁 {bc.dropRolls} lượt rớt đồ khi thành công</div>
                                      <div>💔 Mất {Math.floor(bc.failPenaltyPercent * 100)}% Qi nếu thất bại</div>
                                    </div>
                                  </div>
                                  <button onClick={() => createTeamLobby(bc.id)}
                                    style={{ width:'100%', padding:'9px', borderRadius:'10px', fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'10px', cursor:'pointer',
                                      background:`linear-gradient(135deg, ${bc.color}33, ${bc.color}1a)`, border:`1px solid ${bc.color}66`, color: bc.color }}>
                                    ➕ Tạo Phòng
                                  </button>
                                </div>
                              ))}
                            </div>
                          </div>

                          <div>
                            <div style={{ fontSize:'11px', fontFamily:'Cinzel,serif', fontWeight:700, color:'#93c5fd', marginBottom:'8px' }}>🚪 Phòng Đang Chờ ({openTeamLobbies.length})</div>
                            {openTeamLobbies.length === 0 ? (
                              <div style={{ textAlign:'center', padding:'24px', color:'rgba(140,120,180,0.5)', fontSize:'11px', fontFamily:'Cinzel,serif' }}>
                                Chưa có phòng nào đang chờ. Hãy tạo phòng mới hoặc chờ đạo hữu khác vào!
                              </div>
                            ) : (
                              <div style={{ display:'flex', flexDirection:'column', gap:'8px', maxHeight:'240px', overflowY:'auto' }} className="no-scrollbar">
                                {openTeamLobbies.map(lob => {

                <div className="corner-tl"></div><div className="corner-tr"></div><div className="corner-bl"></div><div className="corner-br"></div>

                {/* Header */}
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', borderBottom:'1px solid rgba(100,60,180,0.25)', paddingBottom:'16px' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:'14px' }}>
                    <div style={{ width:'48px', height:'48px', borderRadius:'12px', background:'linear-gradient(135deg, #2d0a45, #1c0033)', border:`1px solid ${myLinhCan.color}88`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'22px', boxShadow:`0 0 20px ${myLinhCan.glow}` }}>{myLinhCan.icon}</div>
                    <div>
                      <div style={{ fontFamily:'Cinzel Decorative,serif', fontWeight:700, fontSize:'18px', color:'#f5c842' }}>Linh Căn Các</div>
                      <div style={{ fontSize:'11px', color:'rgba(160,140,200,0.5)', marginTop:'2px' }}>Bẩm sinh chi vật, quyết định thiên phú tu luyện của đạo hữu.</div>
                    </div>
                  </div>
                  <button onClick={() => setIsLinhCanModalOpen(false)}
                    style={{ width:'36px', height:'36px', borderRadius:'50%', background:'rgba(60,10,10,0.7)', border:'1px solid rgba(220,60,60,0.4)', color:'#fca5a5', cursor:'pointer', fontSize:'14px', fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center', transition:'all 0.15s' }}>
                    ✕
                  </button>
                </div>

                {/* Current linh căn summary + reroll action */}
                <div style={{ display:'flex', flexWrap:'wrap', alignItems:'center', justifyContent:'space-between', gap:'14px', padding:'14px 18px', borderRadius:'14px', background:'rgba(0,0,0,0.35)', border:`1px solid ${myLinhCan.color}55` }}>
                  <div>
                    <div style={{ fontSize:'10px', color:'rgba(180,160,220,0.6)', letterSpacing:'1px', textTransform:'uppercase', marginBottom:'4px' }}>Linh Căn Hiện Tại</div>
                    <div style={{ fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'15px', color: myLinhCan.color }}>{myLinhCan.icon} {myLinhCan.name}</div>
                    <div style={{ fontSize:'10px', color:'rgba(200,190,220,0.6)', marginTop:'4px' }}>
                      +{Math.round((myLinhCan.qpsMult - 1) * 100)}% Tốc Độ Tu Luyện · +{Math.round((myLinhCan.powerMult - 1) * 100)}% Chiến Lực
                    </div>
                  </div>
                  <button onClick={handleRerollLinhCan} disabled={gameState.qi < LINH_CAN_REROLL_COST} className="btn-gold"
                    style={{ padding:'12px 22px', borderRadius:'12px', fontFamily:'Cinzel,serif', fontSize:'12px', fontWeight:700, cursor: gameState.qi < LINH_CAN_REROLL_COST ? 'not-allowed' : 'pointer', opacity: gameState.qi < LINH_CAN_REROLL_COST ? 0.5 : 1, whiteSpace:'nowrap' }}>
                    🎲 Tẩy Tủy Đổi Linh Căn — {formatNumber(LINH_CAN_REROLL_COST)} Tu Vi
                  </button>
                </div>

                <div style={{ fontSize:'10px', color:'rgba(160,140,200,0.5)', lineHeight:1.5 }}>
                  Linh Căn được Trời Đất phú cho ngay lúc mới nhập môn và sẽ tồn tại vĩnh viễn cùng đạo hữu — không đổi qua bất kỳ lần tải lại hay cập nhật nào. Muốn thay đổi, chỉ có thể tiêu hao Tu Vi để tẩy tủy tại đây.
                </div>

                {/* Grid of all possible linh can */}
                <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(220px, 1fr))', gap:'12px', maxHeight:'340px', overflowY:'auto' }} className="no-scrollbar linhcan-grid">
                  {LINH_CAN_LIST.map(lc => {
                    const isCurrent = gameState.linhCan === lc.id;
                    const chancePercent = (lc.weight / LINH_CAN_TOTAL_WEIGHT * 100);
                    return (
                      <div key={lc.id} className={`linhcan-card${isCurrent ? ' current' : ''}`} style={{ borderColor: isCurrent ? `${lc.color}aa` : undefined }}>
                        <div style={{ display:'flex', alignItems:'center', gap:'8px' }}>
                          <span style={{ fontSize:'22px' }}>{lc.icon}</span>
                          <div>
                            <div style={{ fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'13px', color: lc.color }}>{lc.name}</div>
                            <div style={{ fontSize:'9px', color:'rgba(160,140,200,0.5)' }}>Tỉ lệ: {chancePercent < 1 ? chancePercent.toFixed(1) : Math.round(chancePercent)}%</div>
                          </div>
                        </div>
                        <div style={{ fontSize:'10px', color:'rgba(200,190,220,0.65)', lineHeight:1.5 }}>{lc.desc}</div>
                        <div style={{ display:'flex', gap:'8px', flexWrap:'wrap' }}>
                          <span style={{ fontSize:'9px', color:'#22d3ee', background:'rgba(6,182,212,0.15)', border:'1px solid rgba(6,182,212,0.3)', padding:'2px 8px', borderRadius:'8px' }}>+{Math.round((lc.qpsMult - 1) * 100)}% Tu Luyện</span>
                          <span style={{ fontSize:'9px', color:'#fb7185', background:'rgba(251,113,133,0.15)', border:'1px solid rgba(251,113,133,0.3)', padding:'2px 8px', borderRadius:'8px' }}>+{Math.round((lc.powerMult - 1) * 100)}% Chiến Lực</span>
                        </div>
                        {isCurrent && (
                          <div style={{ position:'absolute', top:'10px', right:'10px', fontSize:'8px', color:'#f5c842', background:'rgba(0,0,0,0.5)', border:'1px solid rgba(245,200,66,0.5)', padding:'2px 7px', borderRadius:'8px', fontFamily:'Cinzel,serif', fontWeight:700 }}>✦ HIỆN TẠI</div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Audio & FX Scripts (Unchanged from original) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const bgm = document.getElementById('bgm-audio');
      const sfxClick = document.getElementById('click-sfx');
      const sfxSlash = document.getElementById('slash-sfx');
      const audioBtn = document.getElementById('toggle-audio-btn');
      let isAudioMuted = true;

      audioBtn.addEventListener('click', () => {
        isAudioMuted = !isAudioMuted;
        if (isAudioMuted) {
          bgm.pause();
          audioBtn.innerText = '🔇';
          audioBtn.style.borderColor = 'rgba(192,132,252,0.4)';
          audioBtn.style.background = 'rgba(10,5,25,0.9)';
        } else {
          bgm.volume = 0.25;
          bgm.play().catch(e => {});
          audioBtn.innerText = '🎵';
          audioBtn.style.borderColor = 'rgba(52,211,153,0.6)';
          audioBtn.style.background = 'rgba(20,60,40,0.8)';
          audioBtn.style.color = '#6ee7b7';
        }
      });

      document.body.addEventListener('click', (e) => {
        const target = e.target.closest('button');
        if (!target) return;
        const text = target.innerText.toLowerCase();
        let floatingMsg = "";
        let floatColor = "";

        if (target.classList.contains('btn-attack') || text.includes('ra đòn') || text.includes('tất sát') || text.includes('3x')) {
          if (!isAudioMuted) { sfxSlash.currentTime = 0; sfxSlash.play().catch(()=>{}); }
          floatingMsg = Math.random() > 0.5 ? "⚔️ Bạo Kích!" : "💥 Trí Mạng!";
          floatColor = "#fb7185";
          const monsterIcon = document.getElementById('monster-icon-display');
          if (monsterIcon) {
            monsterIcon.classList.remove('shake-effect');
            void monsterIcon.offsetWidth;
            monsterIcon.classList.add('shake-effect');
          }
        } else if (text.includes('hấp thu') || text.includes('linh khí')) {
          if (!isAudioMuted) { sfxClick.currentTime = 0; sfxClick.play().catch(()=>{}); }
          floatingMsg = Math.random() > 0.5 ? "✨ +Qi" : "💫 Tụ Linh!";
          floatColor = "#67e8f9";
        }

        if (floatingMsg) {
          const floater = document.createElement('div');
          floater.className = 'floating-text';
          floater.style.color = floatColor;
          floater.style.fontSize = '13px';
          floater.innerText = floatingMsg;
          floater.style.left = (e.clientX - 20 + (Math.random() * 30 - 15)) + 'px';
          floater.style.top  = (e.clientY - 30) + 'px';
          document.body.appendChild(floater);
          setTimeout(() => floater.remove(), 1100);
        }
      });
    });
  </script>
</body>
</html>
