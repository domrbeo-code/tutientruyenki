    // ═══════════════════════════════════════════════════════
    function App() {
      const [playerName, setPlayerName] = React.useState(() => {
        const saved = localStorage.getItem('tu_tien_player_name');
        if (saved) return saved;
        const randomName = 'ĐạoHữu_' + Math.floor(Math.random() * 9000 + 1000);
        localStorage.setItem('tu_tien_player_name', randomName);
        return randomName;
      });
      const [isEditingName, setIsEditingName] = React.useState(false);
      const [tempName, setTempName] = React.useState(playerName);

      const handleSaveName = () => {
        if (!tempName.trim()) return;
        const newName = tempName.trim();
        localStorage.setItem('tu_tien_player_name', newName);
        setPlayerName(newName);
        setIsEditingName(false);
        setGameState(prev => ({
          ...prev,
          logs: [{ id: Date.now().toString(), text: `[Đổi Đạo Hiệu]: Thành công cải danh thành "${newName}"!`, type: 'breakthrough', time: Date.now() }, ...prev.logs].slice(0, 100)
        }));
      };

      const [gameState, setGameState] = React.useState(() => {
        try {
          const savedState = localStorage.getItem(SAVE_KEY);
          if (savedState) {
            const parsed = JSON.parse(savedState);
            if (!parsed.inventory) parsed.inventory = [];
            if (!parsed.logs) parsed.logs = [];
            if (!parsed.items) parsed.items = {};
            if (!parsed.equippedTitleId) parsed.equippedTitleId = 'title_0';
            // Tu sĩ đã có dữ liệu cũ nhưng chưa từng có Linh Căn (trước khi tính năng này ra đời) → random một lần duy nhất, sau đó giữ nguyên vĩnh viễn.
            if (!parsed.linhCan || !LINH_CAN_LIST.some(lc => lc.id === parsed.linhCan)) parsed.linhCan = rollLinhCan();
            const now = Date.now();
            if (parsed.lastSaveTime) {
              const offlineSeconds = Math.floor((now - parsed.lastSaveTime) / 1000);
              if (offlineSeconds > 60) {
                let offlineQps = 0;
                SHOP_ITEMS.forEach(item => {
                  const count = parsed.shopCounts?.[item.id] || 0;
                  offlineQps += count * item.qps;
                });
                parsed.inventory.forEach(item => {
                  if (item.isEquipped) {
                    const gear = ALL_GEARS.find(g => g.id === item.gearId);
                    if (gear) offlineQps += gear.qpsBonus;
                  }
                });
                if (parsed.joinedSectId === 'thanh_van') offlineQps *= 1.2;
                if (offlineQps > 0) {
                  const gained = offlineQps * offlineSeconds;
                  const nextRealm = REALMS[parsed.realmIdx + 1];
                  let maxGained = gained;
                  if (nextRealm && parsed.qi + gained > nextRealm.req) maxGained = nextRealm.req - parsed.qi;
                  if (maxGained > 0) {
                    parsed.qi += maxGained;
                    parsed.totalQi += maxGained;
                    parsed.logs.unshift({ id: Date.now().toString(), text: `[Bế Quan]: Bế quan ngoại tuyến ${offlineSeconds} giây, thu nạp ${formatNumber(maxGained)} Linh Khí!`, type: 'shop', time: Date.now() });
                    parsed.logs = parsed.logs.slice(0, 100);
                  }
                }
              }
            }
            parsed.lastSaveTime = now;
            return parsed;
          }
        } catch (e) {}
        return {
          qi: 0, totalQi: 0, realmIdx: 0, joinedSectId: 'thanh_van',
          shopCounts: {}, inventory: [], equippedGearId: null,
          items: {}, equippedTitleId: 'title_0',
          linhCan: rollLinhCan(),
          lastSaveTime: Date.now(),
          logs: [{ id: '1', text: '[Đại Đạo]: Chào mừng tu sĩ gia nhập Đại Đạo Tranh Phong!', type: 'breakthrough', time: Date.now() }]
        };
      });

      React.useEffect(() => {
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(gameState)); } catch (e) {}
      }, [gameState]);

      const [activeTab, setActiveTab] = React.useState('shop');
      const [invFilter, setInvFilter] = React.useState('all');
      const [combatSubTab, setCombatSubTab] = React.useState('solo');
      const [isBlackMarketModalOpen, setIsBlackMarketModalOpen] = React.useState(false);
      const [isLinhCanModalOpen, setIsLinhCanModalOpen] = React.useState(false);
      const [listingPriceInput, setListingPriceInput] = React.useState({});
      const [biCanhRun, setBiCanhRun] = React.useState(null);
      const [cloudTeamInstances, setCloudTeamInstances] = React.useState({});
      const [myTeamRun, setMyTeamRun] = React.useState(null);
      const [cloudLeaderboard, setCloudLeaderboard] = React.useState([]);
      const [cloudCustomSects, setCloudCustomSects] = React.useState([]);
      const [activeTribulations, setActiveTribulations] = React.useState({});
      const [marketListings, setMarketListings] = React.useState([]);
      const [myTribulation, setMyTribulation] = React.useState(null);
      const [actedPlayers, setActedPlayers] = React.useState(new Set());
      const [actionLoading, setActionLoading] = React.useState(null);
      const [newSectName, setNewSectName] = React.useState('');
      const [newSectDesc, setNewSectDesc] = React.useState('');
      const [, setTick] = React.useState(0);

      React.useEffect(() => {
        const t = setInterval(() => setTick(n => n + 1), 500);
        return () => clearInterval(t);
      }, []);

      const myLinhCan = React.useMemo(() => getLinhCan(gameState.linhCan), [gameState.linhCan]);

      const combatPower = React.useMemo(() => {
        let base = 1 + gameState.realmIdx * 3;
        gameState.inventory.forEach(item => {
          if (item.isEquipped) {
            const gear = ALL_GEARS.find(g => g.id === item.gearId);
            if (gear) base += gear.clickBonus;
          }
        });
        return Math.round(base * getLinhCan(gameState.linhCan).powerMult);
      }, [gameState.realmIdx, gameState.inventory, gameState.linhCan]);

      const clickPower = combatPower;

      const qps = React.useMemo(() => {
        let total = 0;
        SHOP_ITEMS.forEach(item => {
          const count = gameState.shopCounts[item.id] || 0;
          total += count * item.qps;
        });
        gameState.inventory.forEach(item => {
          if (item.isEquipped) {
            const gear = ALL_GEARS.find(g => g.id === item.gearId);
            if (gear) total += gear.qpsBonus;
          }
        });
        if (gameState.joinedSectId === 'thanh_van') total *= 1.2;
        total *= getLinhCan(gameState.linhCan).qpsMult;
        return total;
      }, [gameState.shopCounts, gameState.inventory, gameState.joinedSectId, gameState.linhCan]);

      React.useEffect(() => {
        const interval = setInterval(() => {
          setGameState(prev => {
            const nextRealmObj = REALMS[prev.realmIdx + 1];
            if (!nextRealmObj) {
              const added = qps;
              if (added <= 0) return { ...prev, lastSaveTime: Date.now() };
              return { ...prev, qi: prev.qi + added, totalQi: prev.totalQi + added, lastSaveTime: Date.now() };
            }
            if (prev.qi >= nextRealmObj.req) return { ...prev, lastSaveTime: Date.now() };
            const added = qps;
            if (added <= 0) return { ...prev, lastSaveTime: Date.now() };
            const newQi = Math.min(nextRealmObj.req, prev.qi + added);
            const actualAdded = newQi - prev.qi;
            return { ...prev, qi: newQi, totalQi: prev.totalQi + actualAdded, lastSaveTime: Date.now() };
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [qps]);

      const gameStateRef = React.useRef(gameState);
      gameStateRef.current = gameState;
      const myTribulationRef = React.useRef(myTribulation);
      myTribulationRef.current = myTribulation;
      const myTeamRunRef = React.useRef(myTeamRun);
      myTeamRunRef.current = myTeamRun;
      const cloudTeamInstancesRef = React.useRef(cloudTeamInstances);
      cloudTeamInstancesRef.current = cloudTeamInstances;

      React.useEffect(() => {
        let isMounted = true;
        let tick = 0;
        const doPoll = async () => {
          try {
            const data = await fetchCloudData();
            if (!isMounted) return;
            setCloudLeaderboard(data.leaderboard || []);
            setCloudCustomSects(data.customSects || []);
            setMarketListings(data.marketListings || []);
            const now = Date.now();
            const cleanTribs = {};
            Object.entries(data.activeTribulations || {}).forEach(([k, v]) => {
              if (v && v.endTime > now && v.hp > 0) cleanTribs[k] = v;
            });
            setActiveTribulations(cleanTribs);
            const myTrib = myTribulationRef.current;
            if (myTrib && cleanTribs[playerName]) {
              const cloudHp = cleanTribs[playerName].hp;
              if (cloudHp !== myTrib.hp) setMyTribulation(prev => prev ? { ...prev, hp: cloudHp } : null);
            }
            // ─── Bí Cảnh Tổ Đội: đồng bộ danh sách phòng, tự rời nếu phòng của mình đã bị dọn dẹp ───
            const teamInstances = data.teamInstances || {};
            setCloudTeamInstances(teamInstances);
            const myRun = myTeamRunRef.current;
            if (myRun && !teamInstances[myRun.lobbyId]) {
              setMyTeamRun(null);
            }
          } catch (e) {}
        };
        const doPushLeaderboard = async () => {
          const state = gameStateRef.current;
          await modifyCloudData('LEADERBOARD', { name: playerName, totalQi: state.totalQi, realm: REALMS[state.realmIdx]?.name || "Phàm Nhân", linhCan: state.linhCan });
        };
        const syncLoop = async () => {
          await doPoll();
          tick++;
          if (tick % 5 === 0) await doPushLeaderboard();
        };
        doPushLeaderboard().then(doPoll);
        const syncInterval = setInterval(syncLoop, 2000);
        return () => { isMounted = false; clearInterval(syncInterval); };
      }, [playerName]);

      const handleListMarketItem = async (uniqueId) => {
        const itemToSell = gameState.inventory.find(i => i.uniqueId === uniqueId);
        if (!itemToSell) return;
        const rawPrice = listingPriceInput[uniqueId] || 100;
        const price = parseInt(rawPrice, 10);
        if (isNaN(price) || price <= 0) { alert("Xin vui lòng nhập giá linh khí hợp lệ lớn hơn 0!"); return; }
        const gearData = ALL_GEARS.find(g => g.id === itemToSell.gearId);
        if (!gearData) return;
        const newListing = {
          listingId: 'list_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
          sellerName: playerName, gearId: itemToSell.gearId, gearUniqueId: itemToSell.uniqueId, price: price, time: Date.now()
        };
        const res = await modifyCloudData('ADD_MARKET', { listing: newListing });
        if (res.success) {
          setMarketListings(res.record.marketListings);
          setGameState(prev => ({
            ...prev,
            inventory: prev.inventory.filter(i => i.uniqueId !== uniqueId),
            logs: [{ id: Date.now().toString(), text: `[Hắc Thị]: Ký gửi thành công ${gearData.name} với giá ${formatNumber(price)} Qi!`, type: 'shop', time: Date.now() }, ...prev.logs].slice(0, 100)
          }));
          alert("Ký gửi bảo vật lên Hắc Thị thành công!");
        } else alert(res.error);
      };

      const handleCancelMarketListing = async (listing) => {
        if (listing.sellerName !== playerName) return;
        const res = await modifyCloudData('REMOVE_MARKET', { listingId: listing.listingId });
        if (res.success) {
          setMarketListings(res.record.marketListings);
          const returnedItem = { uniqueId: listing.gearUniqueId || ('item_' + Date.now()), gearId: listing.gearId, isEquipped: false };
          const gearData = ALL_GEARS.find(g => g.id === listing.gearId);
          setGameState(prev => ({
            ...prev,
            inventory: [...prev.inventory, returnedItem],
            logs: [{ id: Date.now().toString(), text: `[Hắc Thị]: Gỡ bán thành công ${gearData?.name || 'Bảo Vật'} về túi đồ!`, type: 'shop', time: Date.now() }, ...prev.logs].slice(0, 100)
          }));
        }
      };

      const handleBuyMarketItem = async (listing) => {
        if (listing.sellerName === playerName) { alert("Đạo hữu không thể tự mua vật phẩm do chính mình ký gửi!"); return; }
        if (gameState.qi < listing.price) { alert("Linh khí bất túc, không đủ linh thạch để mua bảo vật này!"); return; }
        const res = await modifyCloudData('BUY_MARKET', { listingId: listing.listingId });
        const gearData = ALL_GEARS.find(g => g.id === listing.gearId);
        if (res.success) {
          setMarketListings(res.record.marketListings);
          const purchasedItem = { uniqueId: 'item_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7), gearId: listing.gearId, isEquipped: false };
          setGameState(prev => ({
            ...prev, qi: prev.qi - listing.price,
            inventory: [...prev.inventory, purchasedItem],
            logs: [{ id: Date.now().toString(), text: `[Hắc Thị]: Mua thành công ${gearData?.name || 'Bảo Vật'} từ ${listing.sellerName} giá ${formatNumber(listing.price)} Qi!`, type: 'shop', time: Date.now() }, ...prev.logs].slice(0, 100)
          }));
          alert(`Giao dịch thành công! Đã thu phục "${gearData?.name}" vào túi đồ.`);
        } else alert(res.error);
      };

      React.useEffect(() => {
        if (!myTribulation) return;
        const timer = setInterval(() => {
          const now = Date.now();
          if (now >= myTribulation.endTime || myTribulation.hp <= 0) {
            if (myTribulation.hp > 0) {
              const nextRealm = REALMS[gameState.realmIdx + 1];
              setGameState(prev => {
                const updatedState = {
                  ...prev, qi: prev.qi - nextRealm.req, realmIdx: prev.realmIdx + 1,
                  logs: [{ id: Date.now().toString(), text: `[Độ Kiếp Thành Công]: Chống chịu qua lôi kiếp, bước chân vào ${nextRealm.name}!`, type: 'breakthrough', time: Date.now() }, ...prev.logs].slice(0, 100)
                };
                modifyCloudData('END_TRIB_AND_UPDATE', { name: playerName, totalQi: updatedState.totalQi, realm: nextRealm.name, linhCan: updatedState.linhCan })
                  .then(r => r.success && setCloudLeaderboard(r.record.leaderboard));
                return updatedState;
              });
            } else {
              setGameState(prev => {
                const lostQi = Math.floor(prev.qi * 0.6);
                const lostTotalQi = Math.floor(prev.totalQi * 0.6);
                let updatedInventory = [...prev.inventory];
                let lostGearName = null;
                if (updatedInventory.length > 0) {
                  const randomIdx = Math.floor(Math.random() * updatedInventory.length);
                  const removedItem = updatedInventory.splice(randomIdx, 1)[0];
                  const foundGear = ALL_GEARS.find(g => g.id === removedItem.gearId);
                  if (foundGear) lostGearName = foundGear.name;
                }
                const penaltyText = lostGearName
                  ? `[Thiên Kiếp Thất Bại]: Pháp trận bị công phá! Mất ${formatNumber(lostQi)} Qi và đánh rơi bảo vật "${lostGearName}"!`
                  : `[Thiên Kiếp Thất Bại]: Pháp trận bị công phá! Mất ${formatNumber(lostQi)} Qi!`;
                const updatedState = {
                  ...prev, qi: Math.max(0, prev.qi - lostQi), totalQi: Math.max(0, prev.totalQi - lostTotalQi),
                  inventory: updatedInventory,
                  logs: [{ id: Date.now().toString(), text: penaltyText, type: 'fail', time: Date.now() }, ...prev.logs].slice(0, 100)
                };
                modifyCloudData('END_TRIB_AND_UPDATE', { name: playerName, totalQi: updatedState.totalQi, realm: REALMS[updatedState.realmIdx].name, linhCan: updatedState.linhCan });
                return updatedState;
              });
            }
            setMyTribulation(null);
          }
        }, 500);
        return () => clearInterval(timer);
      }, [myTribulation, gameState.realmIdx, playerName]);

      const handleBreakthrough = async () => {
        const nextRealm = REALMS[gameState.realmIdx + 1];
        if (!nextRealm) return;
        if (gameState.qi >= nextRealm.req) {
          if (nextRealm.isMajor) {
            const tribData = { targetRealm: nextRealm.name, hp: 1200, maxHp: 1200, endTime: Date.now() + 30000 };
            setMyTribulation(tribData);
            setGameState(prev => ({
              ...prev,
              logs: [{ id: Date.now().toString(), text: `[Thiên Kiếp Giáng Lâm]: Bắt đầu độ kiếp lên ${nextRealm.name}! Cầm cự 30 giây!`, type: 'breakthrough', time: Date.now() }, ...prev.logs].slice(0, 100)
            }));
            await modifyCloudData('START_TRIB', { name: playerName, tribData });
          } else {
            const nextIdx = gameState.realmIdx + 1;
            const newQi = gameState.qi - nextRealm.req;
            setGameState(prev => ({
              ...prev, qi: newQi, realmIdx: nextIdx,
              logs: [{ id: Date.now().toString(), text: `[Đột Phá]: Thành công tiến cấp lên ${nextRealm.name}!`, type: 'breakthrough', time: Date.now() }, ...prev.logs].slice(0, 100)
            }));
            const res = await modifyCloudData('LEADERBOARD', { name: playerName, totalQi: gameState.totalQi, realm: nextRealm.name, linhCan: gameState.linhCan });
            if (res.success) setCloudLeaderboard(res.record.leaderboard);
          }
        } else {
          setGameState(prev => ({
            ...prev,
            logs: [{ id: Date.now().toString(), text: `[Tâm Ma]: Linh khí bất túc, xung kích ${nextRealm.name} thất bại!`, type: 'fail', time: Date.now() }, ...prev.logs].slice(0, 100)
          }));
        }
      };

      const selectTribulationAction = async (targetPlayerName, actionType) => {
        setActionLoading(targetPlayerName);
        try {
          const data = await fetchCloudData();
          let tribs = data.activeTribulations || {};
          if (!tribs[targetPlayerName]) {
            setGameState(prev => ({
              ...prev,
              logs: [{ id: Date.now().toString(), text: `[Thiên Thư]: Độ kiếp của ${targetPlayerName} đã kết thúc!`, type: 'fail', time: Date.now() }, ...prev.logs].slice(0, 100)
            }));
            setActionLoading(null); return;
          }
          let power = combatPower * 20;
          if (actionType === 'attack' && gameState.joinedSectId === 'huyet_dao') power *= 1.5;
          const oldHp = tribs[targetPlayerName].hp;
          const newHp = actionType === 'protect' ? Math.min(tribs[targetPlayerName].maxHp, oldHp + power) : Math.max(0, oldHp - power);
          const delta = Math.abs(newHp - oldHp);
          const res = await modifyCloudData('INTERACT_TRIB', { targetName: targetPlayerName, newHp });
          if (res.success) {
            setActiveTribulations(res.record.activeTribulations);
            setActedPlayers(prev => new Set([...prev, targetPlayerName]));
            const actionText = actionType === 'protect' ? `🛡️ Hộ Thủ (+${Math.floor(delta)} HP)` : `⚔️ Tấn Công (-${Math.floor(delta)} HP)`;
            setGameState(prev => ({
              ...prev,
              logs: [{ id: Date.now().toString(), text: `[Thiên Thư]: Thực thi ${actionText} cho ${targetPlayerName}!`, type: 'shop', time: Date.now() }, ...prev.logs].slice(0, 100)
            }));
          }
        } catch (e) {}
        setActionLoading(null);
      };

      const buyItem = (itemId) => {
        const item = SHOP_ITEMS.find(i => i.id === itemId);
        if (!item) return;
        const count = gameState.shopCounts[itemId] || 0;
        let cost = Math.floor(item.baseCost * Math.pow(1.6, count));
        if (gameState.joinedSectId === 'am_duong') cost = Math.floor(cost * 0.8);
        if (gameState.qi >= cost) {
          setGameState(prev => ({
            ...prev, qi: prev.qi - cost,
            shopCounts: { ...prev.shopCounts, [itemId]: count + 1 },
            logs: [{ id: Date.now().toString(), text: `[Đan Phòng]: Mua thành công ${item.name}!`, type: 'shop', time: Date.now() }, ...prev.logs].slice(0, 100)
          }));
        }
      };

      // ─── BÍ CẢNH: tiến vào một bí cảnh (thay thế cơ chế đánh quái cũ) ───
      const enterBiCanh = (bcId) => {
        if (biCanhRun || myTeamRun) return;
        const bcDef = BI_CANH_LIST.find(b => b.id === bcId);
        if (!bcDef) return;
        let effectiveDecay = bcDef.baseDecayPerSec / (1 + combatPower / bcDef.powerScale);
        if (gameState.joinedSectId === 'huyet_dao') effectiveDecay *= 0.7;
        const now = Date.now();
        setBiCanhRun({ bcId, startTime: now, endTime: now + bcDef.duration * 1000, maxHp: bcDef.maxHp, decayPerSec: effectiveDecay });
        setGameState(prev => ({
          ...prev,
          logs: [{ id: Date.now().toString(), text: `[Bí Cảnh]: Tiến vào ${bcDef.name}, chuẩn bị đối mặt hiểm nguy...`, type: 'shop', time: Date.now() }, ...prev.logs].slice(0, 100)
        }));
      };

      // ─── BÍ CẢNH: chủ động rút lui giữa chừng — an toàn, không mất mát nhưng cũng không có phần thưởng ───
      const leaveBiCanh = () => {
        if (!biCanhRun) return;
        setGameState(prev => ({
          ...prev,
          logs: [{ id: Date.now().toString(), text: `[Bí Cảnh]: Đã chủ động rút lui an toàn, không nhận được phần thưởng.`, type: 'shop', time: Date.now() }, ...prev.logs].slice(0, 100)
        }));
        setBiCanhRun(null);
      };

      // ─── BÍ CẢNH: vòng lặp theo dõi sinh mệnh & thời gian, tự động phân giải thành công/thất bại ───
      React.useEffect(() => {
        if (!biCanhRun) return;
        const timer = setInterval(() => {
          const now = Date.now();
          const elapsedSec = (now - biCanhRun.startTime) / 1000;
          const currentHp = biCanhRun.maxHp - biCanhRun.decayPerSec * elapsedSec;
          const bcDef = BI_CANH_LIST.find(b => b.id === biCanhRun.bcId);
          if (currentHp <= 0) {
            setGameState(prev => {
              const lostQi = Math.floor(prev.qi * (bcDef?.failPenaltyPercent || 0.15));
              return {
                ...prev, qi: Math.max(0, prev.qi - lostQi),
                logs: [{ id: Date.now().toString(), text: `[Bí Cảnh Thất Bại]: Trọng thương trong ${bcDef?.name || 'Bí Cảnh'}, mất mạng và tổn thất ${formatNumber(lostQi)} Qi tu vi!`, type: 'fail', time: Date.now() }, ...prev.logs].slice(0, 100)
              };
            });
            setBiCanhRun(null);
          } else if (now >= biCanhRun.endTime) {
            setGameState(prev => {
              let droppedItemsLogs = [];
              let newInventoryItems = [...prev.inventory];
              let newItemCounts = { ...prev.items };
              const rolls = bcDef?.dropRolls || 1;
              for (let r = 0; r < rolls; r++) {
                ALL_GEARS.forEach(gear => {
                  const roll = Math.random();
                  if (roll <= gear.dropRate) {
                    const uniqueId = 'item_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7) + '_' + r;
                    newInventoryItems.push({ uniqueId, gearId: gear.id, isEquipped: false });
                    droppedItemsLogs.push(gear.name);
                  }
                });
                ALL_ITEMS.forEach(consumable => {
                  const itemRoll = Math.random();
                  if (itemRoll <= consumable.dropRate) {
                    newItemCounts[consumable.id] = (newItemCounts[consumable.id] || 0) + 1;
                    droppedItemsLogs.push(consumable.name);
                  }
                });
              }
              const reward = bcDef?.reward || 0;
              let dropLogText = droppedItemsLogs.length > 0 ? ` | Nhận được bảo vật: ${droppedItemsLogs.join(', ')}!` : '';
              return {
                ...prev, qi: prev.qi + reward, totalQi: prev.totalQi + reward,
                inventory: newInventoryItems, items: newItemCounts,
                logs: [{ id: Date.now().toString(), text: `[Bí Cảnh Thành Công]: Vượt qua ${bcDef?.name || 'Bí Cảnh'}, đoạt +${formatNumber(reward)} Khí${dropLogText}`, type: 'breakthrough', time: Date.now() }, ...prev.logs].slice(0, 100)
              };
            });
            setBiCanhRun(null);
          }
        }, 300);
        return () => clearInterval(timer);
      }, [biCanhRun]);

      // ─── BÍ CẢNH TỔ ĐỘI: tạo phòng mới ───
      const createTeamLobby = async (bcId) => {
        if (biCanhRun || myTeamRun) return;
        const bcDef = BI_CANH_LIST.find(b => b.id === bcId);
        if (!bcDef) return;
        let decayPerSec = bcDef.baseDecayPerSec / (1 + combatPower / bcDef.powerScale);
        if (gameState.joinedSectId === 'huyet_dao') decayPerSec *= 0.7;
        const lobbyId = 'lobby_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
        const res = await modifyCloudData('CREATE_TEAM_LOBBY', { lobbyId, bcId, hostName: playerName, decayPerSec });
        if (res.success) {
          setCloudTeamInstances(res.record.teamInstances);
          setMyTeamRun({ lobbyId });
        } else {
          alert(res.error || 'Không thể tạo phòng, vui lòng thử lại!');
        }
      };

      // ─── BÍ CẢNH TỔ ĐỘI: tham gia phòng đang chờ của người khác ───
      const joinTeamLobby = async (lobbyId) => {
        if (biCanhRun || myTeamRun) return;
        const lob = cloudTeamInstances[lobbyId];
        if (!lob) return;
        const bcDef = BI_CANH_LIST.find(b => b.id === lob.bcId);
        if (!bcDef) return;
        let decayPerSec = bcDef.baseDecayPerSec / (1 + combatPower / bcDef.powerScale);
        if (gameState.joinedSectId === 'huyet_dao') decayPerSec *= 0.7;
        const res = await modifyCloudData('JOIN_TEAM_LOBBY', { lobbyId, memberName: playerName, decayPerSec });
        if (res.success) {
          setCloudTeamInstances(res.record.teamInstances);
          setMyTeamRun({ lobbyId });
        } else {
          alert(res.error || 'Phòng đã đầy hoặc đã bắt đầu, không thể tham gia!');
        }
      };

      // ─── BÍ CẢNH TỔ ĐỘI: rời phòng chờ, hoặc đóng màn hình kết quả sau khi đã phân giải ───
      const leaveTeamLobby = async () => {
        if (!myTeamRun) return;
        const lobbyId = myTeamRun.lobbyId;
        const lob = cloudTeamInstances[lobbyId];
        setMyTeamRun(null);
        if (lob && lob.status === 'waiting') {
          const res = await modifyCloudData('LEAVE_TEAM_LOBBY', { lobbyId, memberName: playerName });
          if (res.success) setCloudTeamInstances(res.record.teamInstances);
        }
      };

      // ─── BÍ CẢNH TỔ ĐỘI: bắt đầu trận đấu chung, cần tối thiểu 2 thành viên ───
      const startTeamLobby = async () => {
        if (!myTeamRun) return;
        const lob = cloudTeamInstances[myTeamRun.lobbyId];
        if (!lob) return;
        const bcDef = BI_CANH_LIST.find(b => b.id === lob.bcId);
        if (!bcDef) return;
        if (lob.members.length < 2) { alert('Cần tối thiểu 2 người trong phòng mới có thể bắt đầu!'); return; }
        const res = await modifyCloudData('START_TEAM_LOBBY', { lobbyId: myTeamRun.lobbyId, duration: bcDef.duration });
        if (res.success) {
          setCloudTeamInstances(res.record.teamInstances);
        } else {
          alert(res.error || 'Không thể bắt đầu, vui lòng thử lại!');
        }
      };

      // ─── BÍ CẢNH TỔ ĐỘI: vòng lặp theo dõi sinh mệnh CỦA RIÊNG MÌNH & tự động phân giải, báo cáo kết quả lên cloud để đồng đội thấy ───
      React.useEffect(() => {
        if (!myTeamRun) return;
        let hasResolved = false;
        const timer = setInterval(() => {
          if (hasResolved) return;
          const lob = cloudTeamInstancesRef.current[myTeamRun.lobbyId];
          if (!lob || lob.status !== 'active') return;
          const me = lob.members.find(m => m.name === playerName);
          if (!me || me.status !== 'alive') return;
          const bcDef = BI_CANH_LIST.find(b => b.id === lob.bcId);
          if (!bcDef) return;
          const myHp = computeMemberHp(lob, me, bcDef.maxHp);
          const now = Date.now();
          if (myHp <= 0) {
            hasResolved = true;
            setGameState(prev => {
              const lostQi = Math.floor(prev.qi * (bcDef.failPenaltyPercent || 0.15));
              return {
                ...prev, qi: Math.max(0, prev.qi - lostQi),
                logs: [{ id: Date.now().toString(), text: `[Bí Cảnh Tổ Đội Thất Bại]: Trọng thương trong ${bcDef.name}, mất mạng và tổn thất ${formatNumber(lostQi)} Qi tu vi!`, type: 'fail', time: Date.now() }, ...prev.logs].slice(0, 100)
              };
            });
            modifyCloudData('FINISH_TEAM_MEMBER', { lobbyId: myTeamRun.lobbyId, memberName: playerName, outcome: 'dead' })
              .then(res => { if (res.success) setCloudTeamInstances(res.record.teamInstances); });
          } else if (now >= lob.endTime) {
            hasResolved = true;
            setGameState(prev => {
              let droppedItemsLogs = [];
              let newInventoryItems = [...prev.inventory];
              let newItemCounts = { ...prev.items };
              const rolls = bcDef.dropRolls || 1;
              for (let r = 0; r < rolls; r++) {
                ALL_GEARS.forEach(gear => {
                  const roll = Math.random();
                  if (roll <= gear.dropRate) {
                    const uniqueId = 'item_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7) + '_' + r;
                    newInventoryItems.push({ uniqueId, gearId: gear.id, isEquipped: false });
                    droppedItemsLogs.push(gear.name);
                  }
                });
                ALL_ITEMS.forEach(consumable => {
                  const itemRoll = Math.random();
                  if (itemRoll <= consumable.dropRate) {
                    newItemCounts[consumable.id] = (newItemCounts[consumable.id] || 0) + 1;
                    droppedItemsLogs.push(consumable.name);
                  }
                });
              }
              const groupBonus = 1 + 0.15 * (lob.members.length - 1);
              const reward = Math.floor((bcDef.reward || 0) * groupBonus);
              let dropLogText = droppedItemsLogs.length > 0 ? ` | Nhận được bảo vật: ${droppedItemsLogs.join(', ')}!` : '';
              return {
                ...prev, qi: prev.qi + reward, totalQi: prev.totalQi + reward,
                inventory: newInventoryItems, items: newItemCounts,
                logs: [{ id: Date.now().toString(), text: `[Bí Cảnh Tổ Đội Thành Công]: Cùng ${lob.members.length} đồng đội vượt qua ${bcDef.name}, đoạt +${formatNumber(reward)} Khí${dropLogText}`, type: 'breakthrough', time: Date.now() }, ...prev.logs].slice(0, 100)
              };
            });
            modifyCloudData('FINISH_TEAM_MEMBER', { lobbyId: myTeamRun.lobbyId, memberName: playerName, outcome: 'success' })
              .then(res => { if (res.success) setCloudTeamInstances(res.record.teamInstances); });
          }
        }, 300);
        return () => clearInterval(timer);
      }, [myTeamRun, playerName]);

      const toggleEquipInventoryItem = (uniqueId) => {
        setGameState(prev => {
          const targetItem = prev.inventory.find(i => i.uniqueId === uniqueId);
          if (!targetItem) return prev;
          const willBeEquipped = !targetItem.isEquipped;
          const gearData = ALL_GEARS.find(g => g.id === targetItem.gearId);
          const updatedInventory = prev.inventory.map(item => item.uniqueId === uniqueId ? { ...item, isEquipped: willBeEquipped } : item);
          return {
            ...prev, inventory: updatedInventory,
            logs: [{ id: Date.now().toString(), text: `[Túi Đồ]: ${willBeEquipped ? 'Đã trang bị' : 'Đã tháo'} pháp bảo ${gearData?.name || 'Vật Phẩm'}!`, type: 'shop', time: Date.now() }, ...prev.logs].slice(0, 100)
          };
        });
      };

      // ─── VẬT PHẨM: sử dụng đan dược / linh phù ───
      const useConsumableItem = async (itemId) => {
        const consumable = ALL_ITEMS.find(i => i.id === itemId);
        if (!consumable) return;
        const count = gameState.items[itemId] || 0;
        if (count <= 0) return;
        if (consumable.type === 'trib_heal') {
          if (!myTribulation) { alert('Linh phù hộ thân này chỉ có thể sử dụng trong lúc đang Độ Kiếp!'); return; }
          const healAmount = Math.floor(myTribulation.maxHp * consumable.value);
          const newHp = Math.min(myTribulation.maxHp, myTribulation.hp + healAmount);
          const res = await modifyCloudData('INTERACT_TRIB', { targetName: playerName, newHp });
          if (res.success) setActiveTribulations(res.record.activeTribulations);
          setMyTribulation(prev => prev ? { ...prev, hp: newHp } : null);
          setGameState(prev => ({
            ...prev,
            items: { ...prev.items, [itemId]: (prev.items[itemId] || 0) - 1 },
            logs: [{ id: Date.now().toString(), text: `[Vật Phẩm]: Sử dụng ${consumable.name}, hồi phục +${Math.floor(healAmount)} sinh mệnh Độ Kiếp!`, type: 'shop', time: Date.now() }, ...prev.logs].slice(0, 100)
          }));
        } else if (consumable.type === 'qi') {
          setGameState(prev => ({
            ...prev, qi: prev.qi + consumable.value, totalQi: prev.totalQi + consumable.value,
            items: { ...prev.items, [itemId]: (prev.items[itemId] || 0) - 1 },
            logs: [{ id: Date.now().toString(), text: `[Vật Phẩm]: Sử dụng ${consumable.name}, hấp thu +${formatNumber(consumable.value)} Linh Khí!`, type: 'shop', time: Date.now() }, ...prev.logs].slice(0, 100)
          }));
        }
      };

      // ─── VẬT PHẨM: mua đan dược / linh phù bằng Linh Khí (chỉ áp dụng vật phẩm có price) ───
      const buyConsumableItem = (itemId) => {
        const consumable = ALL_ITEMS.find(i => i.id === itemId);
        if (!consumable || !consumable.price) return;
        if (gameState.qi < consumable.price) return;
        setGameState(prev => ({
          ...prev, qi: prev.qi - consumable.price,
          items: { ...prev.items, [itemId]: (prev.items[itemId] || 0) + 1 },
          logs: [{ id: Date.now().toString(), text: `[Đan Phòng]: Mua thành công ${consumable.name}!`, type: 'shop', time: Date.now() }, ...prev.logs].slice(0, 100)
        }));
      };

      // ─── DANH HIỆU: trang bị danh hiệu đã mở khóa ───
      const equipTitle = (titleId) => {
        const titleData = ALL_TITLES.find(t => t.id === titleId);
        if (!titleData) return;
        if (gameState.realmIdx < titleData.requiredRealmIdx) return;
        setGameState(prev => ({
          ...prev, equippedTitleId: titleId,
          logs: [{ id: Date.now().toString(), text: `[Danh Hiệu]: Đã trang bị danh hiệu "${titleData.name}"!`, type: 'breakthrough', time: Date.now() }, ...prev.logs].slice(0, 100)
        }));
      };

      // ─── LINH CĂN: tiêu hao Tu Vi (Linh Khí) để tẩy tủy, random lại Linh Căn ───
      const handleRerollLinhCan = () => {
        if (gameState.qi < LINH_CAN_REROLL_COST) {
          alert(`Tu Vi bất túc! Cần ${formatNumber(LINH_CAN_REROLL_COST)} Tu Vi để tẩy tủy đổi Linh Căn.`);
          return;
        }
        const oldLinhCan = getLinhCan(gameState.linhCan);
        const newLinhCanId = rollLinhCan();
        const newLinhCan = getLinhCan(newLinhCanId);
        setGameState(prev => ({
          ...prev,
          qi: prev.qi - LINH_CAN_REROLL_COST,
          linhCan: newLinhCanId,
          logs: [{ id: Date.now().toString(), text: `[Tẩy Tủy Linh Căn]: Tiêu hao ${formatNumber(LINH_CAN_REROLL_COST)} Tu Vi, ${oldLinhCan.icon} ${oldLinhCan.name} hóa thành ${newLinhCan.icon} ${newLinhCan.name}!`, type: 'breakthrough', time: Date.now() }, ...prev.logs].slice(0, 100)
        }));
      };

      const handleCreateSect = async (e) => {
        e.preventDefault();
        if (!newSectName.trim()) return;
        if (gameState.realmIdx < 8) { alert("Cần đạt cảnh giới Trúc Cơ Kỳ (Sơ Kỳ) trở lên mới có thể khai sơn lập phái!"); return; }
        const newSect = {
          id: 'custom_' + Date.now(), name: newSectName.trim(), buff: 'Tăng +30% Tốc độ Thu Thập & Chiến Lực',
          desc: newSectDesc.trim() || 'Tông môn tự lập của đại năng.', founder: playerName, icon: '✨'
        };
        const res = await modifyCloudData('ADD_SECT', { sect: newSect });
        if (res.success) {
          setCloudCustomSects(res.record.customSects);
          setGameState(prev => ({
            ...prev, joinedSectId: newSect.id,
            logs: [{ id: Date.now().toString(), text: `[Khai Sơn]: Thành công khai lập tông môn "${newSect.name}"!`, type: 'breakthrough', time: Date.now() }, ...prev.logs].slice(0, 100)
          }));
          setNewSectName(''); setNewSectDesc('');
        }
      };

      const allSects = [...DEFAULT_SECTS, ...cloudCustomSects];
      const currentJoinedSect = allSects.find(s => s.id === gameState.joinedSectId) || DEFAULT_SECTS[0];
      const nextRealmObj = REALMS[gameState.realmIdx + 1];
      const progressPercent = nextRealmObj ? Math.min(100, (gameState.qi / nextRealmObj.req) * 100) : 100;
      const isMaxedOut = nextRealmObj && gameState.qi >= nextRealmObj.req;
      const equippedTitle = ALL_TITLES.find(t => t.id === gameState.equippedTitleId) || ALL_TITLES[0];

      // ═══ CƠ CHẾ TU LUYỆN: ấn nút → đếm ngược 5 giây, mỗi giây nhận Qi, hết cooldown phải ấn lại ═══
      const CULTIVATE_DURATION_MS = 5000;
      const CULTIVATE_TICK_MS = 1000;
      const CULTIVATE_TOTAL_TICKS = CULTIVATE_DURATION_MS / CULTIVATE_TICK_MS;

      const [cultivateState, setCultivateState] = React.useState({ active: false, startTime: 0, endTime: 0, ticksGranted: 0 });

      const startCultivate = () => {
        if (isMaxedOut || cultivateState.active) return;
        const now = Date.now();
        setCultivateState({ active: true, startTime: now, endTime: now + CULTIVATE_DURATION_MS, ticksGranted: 0 });
      };

      React.useEffect(() => {
        if (!cultivateState.active) return;
        const timer = setInterval(() => {
          setCultivateState(prev => {
            if (!prev.active) return prev;
            const elapsedTicks = Math.min(CULTIVATE_TOTAL_TICKS, Math.floor((Date.now() - prev.startTime) / CULTIVATE_TICK_MS));
            if (elapsedTicks > prev.ticksGranted) {
              const ticksToGrant = elapsedTicks - prev.ticksGranted;
              setGameState(gs => {
                const nextRealmForTick = REALMS[gs.realmIdx + 1];
                const gain = clickPower * ticksToGrant;
                const nextReq = nextRealmForTick ? nextRealmForTick.req : gs.qi + gain;
                const newQi = Math.min(nextReq, gs.qi + gain);
                const added = newQi - gs.qi;
                if (added <= 0) return gs;
                return { ...gs, qi: newQi, totalQi: gs.totalQi + added };
              });
              return { ...prev, ticksGranted: elapsedTicks, active: elapsedTicks < CULTIVATE_TOTAL_TICKS };
            }
            if (Date.now() >= prev.endTime) return { ...prev, active: false };
            return prev;
          });
        }, 200);
        return () => clearInterval(timer);
      }, [cultivateState.active, clickPower]);

      const cultivateRemainingMs = cultivateState.active ? Math.max(0, cultivateState.endTime - Date.now()) : 0;
      const cultivateRemainingSec = Math.max(0, Math.ceil(cultivateRemainingMs / 1000));
      const cultivateElapsedPercent = cultivateState.active
        ? Math.min(100, ((CULTIVATE_DURATION_MS - cultivateRemainingMs) / CULTIVATE_DURATION_MS) * 100)
        : 0;

      // ─── BÍ CẢNH: giá trị hiển thị theo thời gian thực (làm mới nhờ setTick 500ms có sẵn) ───
      const activeBcDef = biCanhRun ? BI_CANH_LIST.find(b => b.id === biCanhRun.bcId) : null;
      const bcCurrentHp = biCanhRun ? Math.max(0, biCanhRun.maxHp - biCanhRun.decayPerSec * ((Date.now() - biCanhRun.startTime) / 1000)) : 0;
      const bcHpPercent = biCanhRun ? Math.max(0, Math.min(100, (bcCurrentHp / biCanhRun.maxHp) * 100)) : 0;
      const bcTimeLeftSec = biCanhRun ? Math.max(0, Math.ceil((biCanhRun.endTime - Date.now()) / 1000)) : 0;

      // ─── BÍ CẢNH TỔ ĐỘI: giá trị hiển thị dẫn xuất từ dữ liệu cloud đã đồng bộ ───
      const myLobby = myTeamRun ? cloudTeamInstances[myTeamRun.lobbyId] : null;
      const myTeamBcDef = myLobby ? BI_CANH_LIST.find(b => b.id === myLobby.bcId) : null;
      const myLobbyMe = myLobby ? myLobby.members.find(m => m.name === playerName) : null;
      const myTeamHp = (myLobby && myLobbyMe && myTeamBcDef) ? computeMemberHp(myLobby, myLobbyMe, myTeamBcDef.maxHp) : (myTeamBcDef ? myTeamBcDef.maxHp : 0);
      const myTeamHpPercent = myTeamBcDef ? Math.max(0, Math.min(100, (myTeamHp / myTeamBcDef.maxHp) * 100)) : 0;
      const myTeamTimeLeftSec = (myLobby && myLobby.endTime) ? Math.max(0, Math.ceil((myLobby.endTime - Date.now()) / 1000)) : 0;
      const openTeamLobbies = Object.values(cloudTeamInstances).filter(l => l.status === 'waiting' && l.members.length < 4 && !(myTeamRun && l.id === myTeamRun.lobbyId));

      // ─── HP bar dùng chung ở đầu trang: hiển thị khi đang trong bí cảnh solo HOẶC trận Tổ Đội đang diễn ra ───
      const inAnyBiCanh = !!biCanhRun || !!(myLobby && myLobby.status === 'active');
      const headerBcLabel = biCanhRun ? activeBcDef : myTeamBcDef;
      const headerBcHp = biCanhRun ? bcCurrentHp : myTeamHp;
      const headerBcMaxHp = biCanhRun ? biCanhRun.maxHp : (myTeamBcDef ? myTeamBcDef.maxHp : 100);
      const headerBcPercent = biCanhRun ? bcHpPercent : myTeamHpPercent;
      const headerBcTimeLeft = biCanhRun ? bcTimeLeftSec : myTeamTimeLeftSec;

      const fullLeaderboard = React.useMemo(() => {
        let list = [...cloudLeaderboard];
        const index = list.findIndex(item => item.name === playerName);
        if (index >= 0) {
          list[index] = { ...list[index], totalQi: Math.max(list[index].totalQi, gameState.totalQi), realm: REALMS[gameState.realmIdx].name, linhCan: gameState.linhCan };
        } else {
          list.push({ name: playerName, totalQi: gameState.totalQi, realm: REALMS[gameState.realmIdx].name, linhCan: gameState.linhCan });
        }
        list.sort((a, b) => b.totalQi - a.totalQi);
        return list.slice(0, 20).map(item => ({ ...item, isPlayer: item.name === playerName, title: item.realm || 'Phàm Nhân' }));
      }, [cloudLeaderboard, playerName, gameState.totalQi, gameState.realmIdx, gameState.linhCan]);

      // ─── TABS CONFIG ───
      const TABS = [
        { id: 'shop',        label: '💊 Đan Phòng' },
        { id: 'inventory',   label: '🎒 Bảo Vật' },
        { id: 'items',       label: '🧪 Vật Phẩm' },
        { id: 'combat',      label: '🌀 Bí Cảnh' },
        { id: 'sect',        label: '⛩️ Tông Môn' },
        { id: 'titles',      label: '🏅 Danh Hiệu' },
        { id: 'leaderboard', label: '📜 Bảng Xếp Hạng' },
        { id: 'logs',        label: '📖 Nhật Ký' }
      ];

      // ─── RENDER ───
      return (
        <div className="app-shell" style={{ display:'flex', flexDirection:'column', minHeight:'100vh', padding:'16px', gap:'16px', maxWidth:'1280px', margin:'0 auto', position:'relative' }}>

          {/* ══════════════ HEADER ══════════════ */}
          <header className="glass-panel gold-glow app-header" style={{ padding:'20px 24px', position:'relative', overflow:'hidden' }}>
            {/* Corner ornaments */}
            <div className="corner-tl"></div><div className="corner-tr"></div>
            <div className="corner-bl"></div><div className="corner-br"></div>

            {/* Top glow line */}
            <div style={{ position:'absolute', top:0, left:'10%', right:'10%', height:'1px', background:'linear-gradient(to right, transparent, rgba(245,200,66,0.5), transparent)' }}></div>

            <div style={{ display:'flex', flexDirection:'column', gap:'12px' }}>
              {/* Row 1: Identity */}
              <div className="header-row header-row-top" style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'10px' }}>
                <div style={{ display:'flex', alignItems:'center', gap:'14px' }}>
                  {/* Avatar orb */}
                  <div style={{ width:'52px', height:'52px', borderRadius:'50%', background:'linear-gradient(135deg, #4c1d95, #1e1b4b)', border:'2px solid rgba(245,200,66,0.4)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'22px', boxShadow:'0 0 20px rgba(168,85,247,0.4), inset 0 0 15px rgba(99,102,241,0.2)', flexShrink:0 }}>
                    🧘
                  </div>
                  <div>
                    <div style={{ fontSize:'10px', color:'rgba(180,160,220,0.6)', letterSpacing:'2px', textTransform:'uppercase', marginBottom:'3px' }}>
                      ✦ Đạo Hữu ✦
                    </div>
                    {!isEditingName ? (
                      <div style={{ display:'flex', alignItems:'center', gap:'8px' }}>
                        <span style={{ fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'15px', color:'#f5c842' }}>{playerName}</span>
                        <button onClick={() => { setTempName(playerName); setIsEditingName(true); }}
                          style={{ fontSize:'9px', padding:'2px 8px', background:'rgba(100,50,200,0.3)', border:'1px solid rgba(192,132,252,0.3)', borderRadius:'6px', color:'#c084fc', cursor:'pointer', letterSpacing:'1px' }}>
                          ✏️ ĐỔI TÊN
                        </button>
                      </div>
                    ) : (
                      <div style={{ display:'flex', alignItems:'center', gap:'6px' }}>
                        <input type="text" maxLength="15" value={tempName} onChange={e => setTempName(e.target.value)}
                          style={{ background:'rgba(0,0,0,0.8)', border:'1px solid rgba(245,200,66,0.5)', borderRadius:'8px', padding:'4px 10px', fontSize:'12px', color:'#f5c842', fontFamily:'Cinzel,serif', outline:'none', width:'120px' }} />
                        <button onClick={handleSaveName} style={{ padding:'4px 10px', background:'rgba(20,80,50,0.6)', border:'1px solid rgba(52,211,153,0.4)', borderRadius:'6px', color:'#6ee7b7', fontSize:'10px', cursor:'pointer', fontFamily:'Cinzel,serif', fontWeight:700 }}>Lưu</button>
                        <button onClick={() => setIsEditingName(false)} style={{ padding:'4px 10px', background:'rgba(80,20,20,0.6)', border:'1px solid rgba(220,60,60,0.4)', borderRadius:'6px', color:'#fca5a5', fontSize:'10px', cursor:'pointer', fontFamily:'Cinzel,serif', fontWeight:700 }}>Hủy</button>
                      </div>
                    )}
                  </div>
                </div>

                {/* Chợ đen button */}
                <button className="black-market-btn" onClick={() => setIsBlackMarketModalOpen(true)}
                  style={{ padding:'10px 20px', background:'linear-gradient(135deg, #451a03, #2d1003)', border:'1px solid rgba(245,200,66,0.5)', borderRadius:'12px', color:'#f5c842', cursor:'pointer', fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'12px', boxShadow:'0 0 20px rgba(245,200,66,0.2), 0 4px 15px rgba(0,0,0,0.5)', display:'flex', alignItems:'center', gap:'8px', letterSpacing:'1px' }}>
                  <span>🖤</span> HẮC THỊ CHỢ ĐEN
                </button>
              </div>

              {/* Row 2: Realm + Stats */}
              <div className="header-row header-row-bottom" style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'12px' }}>
                <div style={{ display:'flex', flexDirection:'column', gap:'4px' }}>
                  <div className="realm-badge">
                    ✦ {REALMS[gameState.realmIdx]?.name || "Phàm Nhân (Sơ Kỳ)"} ✦
                  </div>
                  <div className="title-badge">
                    「{equippedTitle?.icon} {equippedTitle?.name}」
                  </div>
                  <button onClick={() => setIsLinhCanModalOpen(true)} className="linh-can-badge"
                    style={{ border:`1px solid ${myLinhCan.color}88`, color: myLinhCan.color, boxShadow:`0 0 12px ${myLinhCan.glow}` }}>
                    <span>{myLinhCan.icon}</span>
                    <span>{myLinhCan.name}</span>
                    <span className="lc-hint">🎲 Tẩy Tủy</span>
                  </button>
                </div>

                {/* Stats row */}
                <div className="stats-panel" style={{ display:'flex', gap:'1px', background:'rgba(0,0,0,0.5)', border:'1px solid rgba(100,60,180,0.3)', borderRadius:'12px', overflow:'hidden' }}>
                  <div className="stat-chip">
                    <span className="label">Linh Khí</span>
                    <span className="value" style={{ color:'#f5c842' }}>{formatNumber(gameState.qi)}</span>
                  </div>
                  <div style={{ width:'1px', background:'rgba(100,60,180,0.3)', margin:'8px 0' }}></div>
                  <div className="stat-chip">
                    <span className="label">Chiến Lực</span>
                    <span className="value" style={{ color:'#fb7185' }}>{formatNumber(combatPower)}</span>
                  </div>
                  <div style={{ width:'1px', background:'rgba(100,60,180,0.3)', margin:'8px 0' }}></div>
                  <div className="stat-chip">
                    <span className="label">Tụ Khí / Giây</span>
                    <span className="value" style={{ color:'#22d3ee' }}>+{formatNumber(qps)}</span>
                  </div>
                  <div style={{ width:'1px', background:'rgba(100,60,180,0.3)', margin:'8px 0' }}></div>
                  <div className="stat-chip">
                    <span className="label">Tổng Tích Lũy</span>
                    <span className="value" style={{ color:'#a78bfa' }}>{formatNumber(gameState.totalQi)}</span>
                  </div>
                </div>
              </div>
            </div>
          </header>

          {/* ══════════════ TRIBULATION BANNERS ══════════════ */}
          {Object.keys(activeTribulations).length > 0 && (
            <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
              {Object.entries(activeTribulations).map(([pName, trib]) => {
                const timeLeft = Math.max(0, Math.ceil((trib.endTime - Date.now()) / 1000));
                const hasActed = actedPlayers.has(pName);
                const isLoading = actionLoading === pName;
                const hpPercent = Math.max(0, (trib.hp / trib.maxHp) * 100);
                const isUrgent = timeLeft <= 10;
                return (
                  <div key={pName} className="trib-banner" style={{ background:'linear-gradient(135deg, rgba(30,5,5,0.95), rgba(15,2,2,0.98))', border:'2px solid', borderRadius:'16px', padding:'16px 20px', display:'flex', flexWrap:'wrap', justifyContent:'space-between', alignItems:'center', gap:'14px', position:'relative', overflow:'hidden' }}>
                    {/* Lightning decoration */}
                    <div style={{ position:'absolute', top:0, left:0, right:0, height:'2px', background:'linear-gradient(to right, transparent, rgba(251,191,36,0.7), rgba(220,38,38,0.8), rgba(251,191,36,0.7), transparent)' }}></div>

                    <div style={{ display:'flex', alignItems:'center', gap:'12px' }}>
                      <div style={{ fontSize:'32px', animation:'bounce 1s infinite' }}>⚡</div>
                      <div>
                        <div style={{ display:'flex', alignItems:'center', gap:'8px', marginBottom:'4px' }}>
                          <span style={{ fontFamily:'Cinzel,serif', fontWeight:900, fontSize:'10px', color:'#ef4444', letterSpacing:'2px', textTransform:'uppercase' }}>⚡ THIÊN KIẾP GIÁNG LÂM</span>
                          <span style={{ fontSize:'10px', padding:'2px 8px', borderRadius:'20px', fontWeight:700, background: isUrgent ? 'rgba(220,38,38,0.4)' : 'rgba(0,0,0,0.5)', color: isUrgent ? '#fca5a5' : '#fbbf24', border:`1px solid ${isUrgent ? 'rgba(220,38,38,0.6)' : 'rgba(251,191,36,0.4)'}`, animation: isUrgent ? 'pulse 0.8s infinite' : 'none' }}>
                            ⏱ {timeLeft}s
                          </span>
                        </div>
                        <div style={{ fontFamily:'Cinzel,serif', fontSize:'13px', color:'#f5e6c8' }}>
                          Đạo hữu <span style={{ color:'#22d3ee', fontWeight:700 }}>{pName}</span> đang độ kiếp lên <span style={{ color:'#f5c842', fontWeight:700 }}>{trib.targetRealm}</span>
                        </div>
                      </div>
                    </div>

                    <div style={{ display:'flex', flexWrap:'wrap', alignItems:'center', gap:'14px', flex:1, justifyContent:'flex-end' }}>
                      {/* HP Bar */}
                      <div style={{ minWidth:'200px', flex:'0 1 240px' }}>
                        <div style={{ display:'flex', justifyContent:'space-between', fontSize:'10px', color:'rgba(220,180,180,0.7)', marginBottom:'4px' }}>
                          <span>🔴 Sinh Mệnh</span>
                          <span style={{ color:'#fca5a5', fontWeight:700 }}>{Math.floor(trib.hp)} / {trib.maxHp}</span>
                        </div>
                        <div className="hp-bar-track">
                          <div className="hp-bar-fill" style={{ width:`${hpPercent}%` }}></div>
                        </div>
                      </div>

                      {/* Action buttons */}
                      {pName !== playerName ? (
                        <div style={{ display:'flex', gap:'8px' }}>
                          {isLoading ? (
                            <span style={{ fontSize:'11px', color:'#fbbf24', padding:'8px 14px', background:'rgba(0,0,0,0.5)', border:'1px solid rgba(251,191,36,0.4)', borderRadius:'10px', fontFamily:'Cinzel,serif', animation:'pulse 1s infinite' }}>
                              ⚡ Đang gửi lên Thiên Đạo...
                            </span>
                          ) : hasActed ? (
                            <span style={{ fontSize:'11px', color:'#6ee7b7', padding:'8px 14px', background:'rgba(0,0,0,0.5)', border:'1px solid rgba(52,211,153,0.4)', borderRadius:'10px', fontFamily:'Cinzel,serif' }}>
                              ✅ Đã tương tác
                            </span>
                          ) : (
                            <>
                              <button onClick={() => selectTribulationAction(pName, 'protect')} className="btn-success" style={{ padding:'8px 16px', borderRadius:'10px', fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'11px', cursor:'pointer', display:'flex', alignItems:'center', gap:'5px', letterSpacing:'0.5px' }}>
                                🛡️ Hộ Thủ
                              </button>
                              <button onClick={() => selectTribulationAction(pName, 'attack')} className="btn-danger" style={{ padding:'8px 16px', borderRadius:'10px', fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'11px', cursor:'pointer', display:'flex', alignItems:'center', gap:'5px', letterSpacing:'0.5px' }}>
                                ⚔️ Tấn Công
                              </button>
                            </>
                          )}
                        </div>
                      ) : (
                        <span style={{ fontSize:'12px', color:'#f5c842', fontFamily:'Cinzel,serif', animation:'pulse 1.5s infinite' }}>
                          🧘 Đang tĩnh tọa độ kiếp...
                        </span>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* ══════════════ MAIN GRID ══════════════ */}
          <main className="main-grid" style={{ display:'grid', gridTemplateColumns:'repeat(12, 1fr)', gap:'16px', flex:1 }}>

            {/* ── LEFT PANEL (4 cols) ── */}
            <div style={{ gridColumn:'span 12', display:'flex', flexDirection:'column', gap:'14px' }}
                 className="lg:col-span-4 col-span-12 left-panel">

              {/* ── Cultivation Orb ── */}
              <div className="glass-panel" style={{ padding:'28px 20px', display:'flex', flexDirection:'column', alignItems:'center', gap:'20px', position:'relative', overflow:'hidden' }}>
                <div className="corner-tl"></div><div className="corner-tr"></div>
                <div className="corner-bl"></div><div className="corner-br"></div>
                {/* Ambient glow */}
                <div style={{ position:'absolute', top:'50%', left:'50%', transform:'translate(-50%,-50%)', width:'200px', height:'200px', borderRadius:'50%', background:'radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%)', pointerEvents:'none' }}></div>

                {/* ORB BUTTON */}
                <div style={{ position:'relative' }} className="orb-float orb-shell">
                  {/* Outer rotating ring */}
                  <div className="ring-cw" style={{ position:'absolute', inset:'-12px', borderRadius:'50%', border:'1px dashed rgba(192,132,252,0.25)' }}></div>
                  {/* Middle ring */}
                  <div className="ring-ccw" style={{ position:'absolute', inset:'-6px', borderRadius:'50%', border:'1px solid rgba(99,102,241,0.2)' }}></div>
                  {/* Inner ring */}
                  <div className="ring-cw2" style={{ position:'absolute', inset:'-2px', borderRadius:'50%', border:'2px solid rgba(245,200,66,0.15)' }}></div>

                  <button
                    onClick={startCultivate}
                    disabled={isMaxedOut || cultivateState.active}
                    style={{
                      width:'100%', height:'100%', borderRadius:'50%',
                      cursor: (isMaxedOut || cultivateState.active) ? 'not-allowed' : 'pointer',
                      background: isMaxedOut
                        ? 'radial-gradient(circle at 35% 35%, #5a3010, #2d1500, #1a0800)'
                        : cultivateState.active
                          ? 'radial-gradient(circle at 35% 35%, #0e4f5c, #073642, #041b21)'
                          : 'radial-gradient(circle at 35% 35%, #312e81, #1e1b4b, #0d0b2b)',
                      border: `2px solid ${isMaxedOut ? 'rgba(245,200,66,0.6)' : cultivateState.active ? 'rgba(34,211,238,0.7)' : 'rgba(99,102,241,0.5)'}`,
                      boxShadow: isMaxedOut
                        ? '0 0 40px rgba(245,200,66,0.3), inset 0 0 30px rgba(245,200,66,0.1)'
                        : cultivateState.active
                          ? '0 0 40px rgba(34,211,238,0.35), inset 0 0 30px rgba(34,211,238,0.15)'
                          : '0 0 40px rgba(99,102,241,0.3), inset 0 0 30px rgba(99,102,241,0.1)',
                      display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'6px',
                      transition:'all 0.15s', outline:'none',
                      animation: isMaxedOut ? 'pulse 2s infinite' : cultivateState.active ? 'pulseJade 1.2s infinite' : 'none',
                      position:'relative', overflow:'hidden'
                    }}>
                    {/* Inner shimmer */}
                    <div style={{ position:'absolute', top:'-50%', left:'-50%', width:'40%', height:'200%', background:'linear-gradient(to bottom right, transparent, rgba(255,255,255,0.06), transparent)', transform:'rotate(-30deg)', pointerEvents:'none' }}></div>
                    <span style={{
                      fontSize: cultivateState.active ? '40px' : '38px',
                      fontFamily: cultivateState.active ? 'Cinzel,serif' : undefined,
                      fontWeight: cultivateState.active ? 900 : undefined,
                      color: cultivateState.active ? '#a5f3fc' : undefined,
                      filter: isMaxedOut
                        ? 'drop-shadow(0 0 12px rgba(245,200,66,0.8))'
                        : cultivateState.active
                          ? 'drop-shadow(0 0 10px rgba(34,211,238,0.9))'
                          : 'drop-shadow(0 0 10px rgba(99,102,241,0.8))'
                    }}>
                      {isMaxedOut ? '🌟' : cultivateState.active ? cultivateRemainingSec : '🌌'}
                    </span>
                    <span style={{ fontFamily:'Cinzel,serif', fontWeight:900, fontSize:'10px', letterSpacing:'1.5px', color: isMaxedOut ? '#f5c842' : cultivateState.active ? '#67e8f9' : '#c4b5fd', textAlign:'center', lineHeight:1.3 }}>
                      {isMaxedOut ? 'ĐÃ ĐẠT NGƯỠNG' : cultivateState.active ? 'ĐANG HẤP THU...' : 'HẤP THU\nLINH KHÍ'}
                    </span>
                    <span style={{ fontSize:'10px', color: isMaxedOut ? '#fbbf24' : cultivateState.active ? '#22d3ee' : '#67e8f9' }}>
                      {isMaxedOut ? '⚡ Cần Đột Phá!' : cultivateState.active ? `+${clickPower} Qi/giây` : `+${clickPower} Qi/giây × 5s`}
                    </span>
                  </button>
                </div>

                {/* ── Thanh Tu Luyện: đếm ngược cooldown 5 giây ── */}
                <div style={{ width:'100%', display:'flex', flexDirection:'column', gap:'6px' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', fontSize:'10px', letterSpacing:'0.5px' }}>
                    <span style={{ color: cultivateState.active ? '#67e8f9' : 'rgba(192,132,252,0.6)', fontFamily:'Cinzel,serif', fontWeight:700 }}>
                      {cultivateState.active ? '🌀 ĐANG TU LUYỆN...' : '💤 CHƯA TU LUYỆN'}
                    </span>
                    <span style={{ color: cultivateState.active ? '#22d3ee' : 'rgba(150,130,200,0.5)', fontWeight:700 }}>
                      {cultivateState.active ? `Còn ${cultivateRemainingSec}s` : 'Nhấn nút để bắt đầu'}
                    </span>
                  </div>
                  <div className="cultivate-bar-track">
                    <div className="cultivate-bar-fill" style={{ width:`${cultivateElapsedPercent}%` }}></div>
                  </div>
                </div>

                {/* Progress */}
                <div style={{ width:'100%', display:'flex', flexDirection:'column', gap:'8px' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', fontSize:'10px', letterSpacing:'0.5px' }}>
                    <span style={{ color:'rgba(192,132,252,0.7)', fontFamily:'Cinzel,serif' }}>TIẾN CẢNH GIỚI</span>
                    <span style={{ color:'#f5c842' }}>
                      {nextRealmObj ? `${formatNumber(gameState.qi)} / ${formatNumber(nextRealmObj.req)}` : '⭐ Đạo Tổ Cảnh'}
                    </span>
                  </div>
                  <div className="progress-track">
                    <div className="qi-bar-fill" style={{ width:`${progressPercent}%` }}></div>
                  </div>
                  <div style={{ textAlign:'right', fontSize:'10px', color:'rgba(150,130,200,0.5)' }}>{progressPercent.toFixed(1)}%</div>
                </div>

                {/* Bí Cảnh HP bar — hiện khi đang trong bí cảnh solo hoặc trận Tổ Đội đang diễn ra */}
                {inAnyBiCanh && (
                  <div style={{ width:'100%', display:'flex', flexDirection:'column', gap:'6px', padding:'10px', background:'rgba(60,5,5,0.35)', border:'1px solid rgba(220,38,38,0.35)', borderRadius:'10px' }}>
                    <div style={{ display:'flex', justifyContent:'space-between', fontSize:'10px', letterSpacing:'0.5px' }}>
                      <span style={{ color:'#fca5a5', fontFamily:'Cinzel,serif' }}>
                        {headerBcLabel?.icon} {headerBcLabel?.name}{myLobby ? ` (👥 ${myLobby.members.length})` : ''} — Còn {headerBcTimeLeft}s
                      </span>
                      <span style={{ color:'#fca5a5', fontWeight:700 }}>{Math.ceil(headerBcHp)} / {headerBcMaxHp} Sinh Mệnh</span>
                    </div>
                    <div className="hp-bar-track">
                      <div className="hp-bar-fill" style={{ width:`${headerBcPercent}%` }}></div>
                    </div>
                    {biCanhRun && (
                      <button onClick={leaveBiCanh}
                        style={{ alignSelf:'flex-end', padding:'4px 10px', borderRadius:'6px', fontSize:'9px', fontFamily:'Cinzel,serif', fontWeight:700, cursor:'pointer', background:'rgba(40,40,60,0.6)', border:'1px solid rgba(150,140,170,0.3)', color:'rgba(200,180,220,0.7)' }}>
                        🚪 Rút Lui An Toàn
                      </button>
                    )}
                  </div>
                )}

                {/* Breakthrough button */}
                {myTribulation ? (
                  <div style={{ width:'100%', padding:'14px', background:'linear-gradient(135deg, rgba(60,5,5,0.8), rgba(30,2,2,0.9))', border:'2px solid rgba(220,38,38,0.6)', borderRadius:'12px', textAlign:'center', animation:'pulse 1s infinite', boxShadow:'0 0 25px rgba(220,38,38,0.3)' }}>
                    <div style={{ fontFamily:'Cinzel,serif', fontWeight:900, fontSize:'11px', color:'#fca5a5', letterSpacing:'2px', marginBottom:'4px' }}>⚡ ĐANG ĐỘ KIẾP</div>
                    <div style={{ fontSize:'20px', fontFamily:'Cinzel,serif', fontWeight:700, color:'#f87171' }}>{Math.max(0, Math.ceil((myTribulation.endTime - Date.now()) / 1000))}s</div>
                    <div style={{ fontSize:'10px', color:'rgba(220,130,130,0.7)', marginTop:'4px' }}>HP: {Math.floor(myTribulation.hp)} / {myTribulation.maxHp}</div>
                  </div>
                ) : (
                  <button onClick={handleBreakthrough} style={{
                    width:'100%', padding:'12px 16px',
                    background: isMaxedOut
                      ? 'linear-gradient(135deg, #92400e, #7c2d12)'
                      : 'linear-gradient(135deg, rgba(76,29,149,0.5), rgba(49,19,97,0.6))',
                    border: `1px solid ${isMaxedOut ? 'rgba(251,191,36,0.6)' : 'rgba(139,92,246,0.4)'}`,
                    borderRadius:'12px', cursor:'pointer', fontFamily:'Cinzel,serif', fontWeight:700,
                    fontSize:'11px', letterSpacing:'1.5px', color: isMaxedOut ? '#fbbf24' : '#a78bfa',
                    boxShadow: isMaxedOut ? '0 0 25px rgba(251,191,36,0.3)' : '0 2px 15px rgba(76,29,149,0.4)',
                    animation: isMaxedOut ? 'bounce 1.5s infinite' : 'none', transition:'all 0.2s'
                  }}>
                    ⚡ XUNG KÍCH ĐỘT PHÁ {nextRealmObj?.isMajor ? '— MỐC LỚN' : ''}
                  </button>
                )}
              </div>

              {/* ── Sect Panel ── */}
              <div className="glass-panel" style={{ padding:'16px 18px' }}>
                <div style={{ fontSize:'9px', letterSpacing:'2px', textTransform:'uppercase', color:'rgba(245,200,66,0.5)', marginBottom:'10px', display:'flex', alignItems:'center', gap:'6px' }}>
                  <span style={{ flex:1, height:'1px', background:'linear-gradient(to right, transparent, rgba(245,200,66,0.3))' }}></span>
                  ⛩️ TÔNG MÔN HIỆN TẠI
                  <span style={{ flex:1, height:'1px', background:'linear-gradient(to left, transparent, rgba(245,200,66,0.3))' }}></span>
                </div>
                <div style={{ padding:'12px 14px', background:'linear-gradient(135deg, rgba(50,20,90,0.5), rgba(25,10,50,0.6))', border:'1px solid rgba(139,92,246,0.3)', borderRadius:'12px', display:'flex', flexDirection:'column', gap:'5px' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:'8px' }}>
                    <span style={{ fontSize:'20px' }}>{currentJoinedSect.icon || '⛩️'}</span>
                    <span style={{ fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'14px', color:'#f5c842' }}>{currentJoinedSect.name}</span>
                  </div>
                  <div style={{ fontSize:'11px', color:'#67e8f9', lineHeight:1.4 }}>{currentJoinedSect.buff}</div>
                  <div style={{ fontSize:'10px', color:'rgba(160,140,200,0.5)' }}>Sáng lập: {currentJoinedSect.founder || 'Hệ Thống'}</div>
                </div>
              </div>

              {/* ── Mini Log ── */}
              <div className="glass-panel" style={{ padding:'14px 16px', flex:1 }}>
                <div style={{ fontSize:'9px', letterSpacing:'2px', textTransform:'uppercase', color:'rgba(100,200,255,0.4)', marginBottom:'8px' }}>📖 HOẠT ĐỘNG GẦN ĐÂY</div>
                <div style={{ display:'flex', flexDirection:'column', gap:'3px', maxHeight:'130px', overflow:'hidden' }}>
                  {gameState.logs.slice(0, 6).map((log, i) => (
                    <div key={log.id + i} style={{ fontSize:'10px', display:'flex', gap:'6px', padding:'3px 0', borderBottom:'1px solid rgba(255,255,255,0.03)' }}>
                      <span style={{ color:'rgba(140,120,180,0.4)', minWidth:'55px', flexShrink:0 }}>{new Date(log.time).toLocaleTimeString('vi', { hour:'2-digit', minute:'2-digit', second:'2-digit' })}</span>
                      <span style={{ color: log.type === 'breakthrough' ? '#fbbf24' : log.type === 'fail' ? '#f87171' : '#67e8f9', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{log.text}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* ── RIGHT PANEL (8 cols) ── */}
            <div style={{ gridColumn:'span 12', display:'flex', flexDirection:'column', gap:'14px' }}
                 className="lg:col-span-8 col-span-12 right-panel">

              {/* ── Tabs ── */}
              <div style={{ background:'linear-gradient(135deg, rgba(15,8,30,0.9), rgba(8,4,18,0.95))', border:'1px solid rgba(100,60,180,0.3)', borderRadius:'14px', padding:'6px', display:'flex', gap:'4px', boxShadow:'0 4px 20px rgba(0,0,0,0.5)', overflowX:'auto' }} className="no-scrollbar tab-strip">
                {TABS.map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`tab-btn${activeTab === tab.id ? ' active' : ''}`}>
                    {tab.label}
                  </button>
                ))}
              </div>

              {/* ── Tab Content ── */}
              <div className="glass-panel tab-content" style={{ padding:'24px', flex:1, minHeight:'420px', display:'flex', flexDirection:'column', gap:'18px', position:'relative', overflow:'hidden' }}>
                <div className="corner-tl"></div><div className="corner-tr"></div>

                {/* ─── SHOP TAB ─── */}
                {activeTab === 'shop' && (
                  <div style={{ display:'flex', flexDirection:'column', gap:'18px' }}>
                    <div>
                      <div style={{ fontFamily:'Cinzel Decorative,serif', fontSize:'16px', fontWeight:700, color:'#f5c842', marginBottom:'4px' }} className="section-title">💊 Đan Phòng & Tụ Linh Trận</div>
                      <div className="ornament-divider" style={{ margin:'8px 0' }}>TỰ ĐỘNG TỤ TẬP LINH KHÍ</div>
                      <div className="section-desc" style={{ fontSize:'11px', color:'rgba(160,140,200,0.6)' }}>Xây dựng kiến trúc tu luyện để gia tăng tốc độ tích tụ linh khí.</div>
                    </div>
                    <div className="shop-grid" style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(200px, 1fr))', gap:'12px' }}>
                      {SHOP_ITEMS.map(item => {
                        const count = gameState.shopCounts[item.id] || 0;
                        let cost = Math.floor(item.baseCost * Math.pow(1.6, count));
                        if (gameState.joinedSectId === 'am_duong') cost = Math.floor(cost * 0.8);
                        const canBuy = gameState.qi >= cost;
                        return (
                          <div key={item.id} className="item-card" style={{ display:'flex', flexDirection:'column', justifyContent:'space-between', gap:'12px' }}>
                            <div>
                              <div style={{ fontSize:'28px', marginBottom:'8px', filter:'drop-shadow(0 0 8px rgba(99,102,241,0.5))' }}>{item.icon}</div>
                              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'5px' }}>
                                <span style={{ fontFamily:'Cinzel,serif', fontWeight:700, fontSize:'13px', color:'#e2e8f0' }}>{item.name}</span>
                                <span style={{ fontSize:'10px', padding:'2px 8px', background:'rgba(76,29,149,0.4)', border:'1px solid rgba(139,92,246,0.4)', borderRadius:'20px', color:'#c084fc', fontWeight:700 }}>×{count}</span>
                              </div>
                              <p style={{ fontSize:'11px', color:'rgba(160,140,200,0.6)', lineHeight:1.5, marginBottom:'6px' }}>{item.desc}</p>
                              <div style={{ fontSize:'11px', color:'#22d3ee', display:'flex', alignItems:'center', gap:'4px' }}>
                                <span>⚡</span><span>+{item.qps}/s mỗi cái</span>
                              </div>
                            </div>
                            <button onClick={() => buyItem(item.id)} disabled={!canBuy} className={canBuy ? 'btn-primary' : 'btn-primary'} style={{ opacity: canBuy ? 1 : 0.4, cursor: canBuy ? 'pointer' : 'not-allowed' }}>
                              {canBuy ? '✦ ' : '🔒 '} Luyện Hóa — {formatNumber(cost)} Qi
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* ─── INVENTORY TAB ─── */}
                {activeTab === 'inventory' && (
                  <div style={{ display:'flex', flexDirection:'column', gap:'16px' }}>
                    <div>
                      <div style={{ fontFamily:'Cinzel Decorative,serif', fontSize:'16px', fontWeight:700, color:'#f5c842', marginBottom:'4px' }} className="section-title">🎒 Túi Đồ & Pháp Bảo</div>
                      <div className="ornament-divider" style={{ margin:'8px 0' }}>CÁC BẢO VẬT ĐÃ THU PHỤC</div>
                      <div style={{ fontSize:'11px', color:'rgba(160,140,200,0.6)' }}>Pháp bảo thu phục từ Bí Cảnh. Trang bị để khuếch đại chiến lực.</div>
                    </div>
                    {gameState.inventory.length === 0 ? (
                      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'10px', padding:'50px 20px', color:'rgba(140,120,180,0.5)' }}>
                        <span style={{ fontSize:'48px' }}>🎒</span>
                        <span style={{ fontFamily:'Cinzel,serif', fontSize:'13px' }}>Túi đồ trống rỗng</span>

                    ) : (
                      <React.Fragment>
                        <div style={{ display:'flex', gap:'6px', flexWrap:'wrap' }}>
